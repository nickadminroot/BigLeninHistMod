 ROM_forest_maneuvers_desc: "Наши рейнджеры превосходно действуют в лесистой местности."
 ROM_royal_guard: "Королевская гвардия"
 ROM_royal_guard_desc: "Отборные дивизии, охраняющие корону — лучшие солдаты Румынии."
 ROM_romanian_steel: "Румынская сталь"
 ROM_romanian_steel_desc: "Снижение стоимости производства средних и лёгких танков на 10%."
 ROM_apfsds: "Подкалиберные с отделяющимся поддоном"
 ROM_apfsds_desc: "Бронебойные оперённые подкалиберные снаряды дают нашим ПТ-орудиям +20% к атаке и бронепробитию."