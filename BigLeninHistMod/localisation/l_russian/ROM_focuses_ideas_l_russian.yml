l_russian:
 ROM_tank_production: "Танковое производство"
 ROM_tank_production_desc: "Инвестиции в отечественное танкостроение для оснащения бронетанковых сил современными боевыми машинами."
 ROM_vanatori_de_munte: "Корпус рейнджеров"
 ROM_vanatori_de_munte_desc: "Наши горные войска переформировываются в корпус рейнджеров, способный действовать в любых условиях с превосходной эффективностью."
 ROM_vanatori_de_munte_tt:0 "Открывает технологию §Yрейнджеров§!.\n§YСпецвойска§! в лесах:\nСкорость: §G+10%§!\nАтака: §G+10%§!\nЗащита: §G+10%§!"
 ROM_romanian_maneuvers: "Румынские учения"
 ROM_romanian_maneuvers_desc: "Наша программа боевой подготовки делает упор на постоянные манёвры и готовность."
 ROM_forest_maneuvers: "Лесные манёвры"
 ROM_forest_maneuvers_desc: "Скорость передвижения, атака и защита спецвойск в лесах: +10%."
 ROM_royal_guard: "Королевская гвардия"
 ROM_royal_guard_desc: "Атака и защита спецвойск: +5%. Потери от истощения: -10%."
 ROM_romanian_steel: "Румынская сталь"
 ROM_romanian_steel_desc: "Снижение стоимости производства средних и лёгких танков на 10%."
 ROM_apfsds: "Подкалиберные с отделяющимся поддоном"
 ROM_apfsds_desc: "Бронебойные оперённые подкалиберные снаряды дают нашим ПТ-орудиям +20% к атаке и бронепробитию."
