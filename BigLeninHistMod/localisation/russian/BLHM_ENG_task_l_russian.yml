l_russian:
 STATE_1083:0 "Западный Азербайджан"
 BLHM_ENG_civilian_construction:0 "Гражданское строительство"
 BLHM_ENG_civilian_construction_desc:0 "Важно расширять промышленные мощности страны на благо жителей нашего государства."
 BLHM_ENG_strengthen_ties_with_france:0 "Усиление связей с Францией"
 BLHM_ENG_strengthen_ties_with_france_desc:0 "Возможно, когда-то у нас были разногласия с Францией, но теперь мы должны стоять вместе перед лицом растущих угроз. Совместная экономическая программа принесёт пользу обеим нациям."
 BLHM_ENG_strengthen_ties_france_tt:0 "Строительство во французских североафриканских провинциях требует существования Франции и её контроля над этими территориями."
 BLHM_ENG_french_bases_in_commonwealth:0 "Французские военные базы в Австралии и Индии"
 BLHM_ENG_french_bases_in_commonwealth_desc:0 "Сохраняется напряжённость в Азиатском регионе. Нужно объединить усилия с нашими коллегами из Франции для того, чтобы стать единым фронтом против возрастающей угрозы со стороны Японии."
 BLHM_ENG_aid_china:0 "Помощь Китаю"
 BLHM_ENG_aid_china_desc:0 "Китай может стать сдерживающим фактором. Поможем им в войне с Японией."
 BLHM_ENG_british_specialists_in_china:0 "Британские специалисты в Китае"
 BLHM_ENG_british_specialists_in_china_desc:0 "Нам нужно детальнее изучить боевые действия в Китае, чтобы улучшить доктрины ведения войны, которые не менялись с Великой войны."
 BLHM_ENG_african_railway_project:0 "Проект Африканской железной дороги"
 BLHM_ENG_african_railway_project_desc:0 "Африка — это сундук с золотом, который только и ждёт, чтобы его забрали. Но сундук нужно как-то увезти. Совместный проект железной дороги с Францией позволит усилить нашу торговлю в этом регионе."
 BLHM_ENG_african_railway_tt:0 "Запланирован железнодорожный маршрут 3-го уровня от Касабланки до Кейптауна вдоль подконтрольного союзникам атлантического побережья. Полное непрерывное соединение зависит от союзного контроля над промежуточными провинциями."
 BLHM_ENG_joint_radar_development:0 "Совместные разработки радаров"
 BLHM_ENG_joint_radar_bonus:0 "Бонус совместной разработки радаров"
 BLHM_ENG_joint_radar_development_desc:0 "Передовые технологии, связанные с электромагнитными волнами, позволят нам узнавать о подлёте противника, как только он поднял авиацию в воздух."
 BLHM_ENG_national_prosperity_treaty:0 "Договор национального процветания"
 BLHM_ENG_national_prosperity_treaty_desc:0 "Исторический совместный договор с Францией укрепляет наши экономические основы — снижая потребности товаров народного потребления, ускоряя строительство фабрик и повышая национальную стабильность."
 BLHM_ENG_joint_tank_development:0 "Совместные танковые разработки"
 BLHM_ENG_joint_tank_development_desc:0 "Возможность перенять опыт коллег из Парижа — это подарок судьбы, ведь их Somua S35 и Char B1 считаются одними из лучших танков в мире."
 BLHM_ENG_joint_tank_development_tt:0 "§YСовместные танковые разработки§! завершены. +7% к противотанковой атаке и +5% к противопехотной атаке будут интегрированы при появлении духа §Y«Новые танки»§!."
 BLHM_ENG_syrian_alexandrian_corps:0 "Сирийско-Александрийский корпус"
 BLHM_ENG_syrian_alexandrian_corps_desc:0 "Мы проводим учения в экстремальных условиях Союзников, чтобы лучше защищать наши территории. Совместная подготовка в пустыне повышает оборону и мобильность пехоты на любой местности."
 BLHM_ENG_task.1.t:0 "Совместная программа разработки радаров"
 BLHM_ENG_task.1.d:0 "Наши британские союзники завершили совместную программу разработки радаров. Их учёные делятся с нами прорывом, предоставляя значительное преимущество в исследованиях радарных технологий."
 BLHM_ENG_task.1.a:0 "Отлично! Наши радарные технологии совершат скачок!"
 BLHM_CHI_british_advisers:0 "Британские советники"
 BLHM_CHI_british_advisers_desc:0 "Британские военные советники обучают наши войска, повышая боевую эффективность пехоты и способность к укреплению позиций."
 BLHM_ENG_china_doctrine_observers:0 "Наблюдатели за китайской доктриной"
 BLHM_ENG_china_doctrine_observers_desc:0 "Наши наблюдатели в Китае собирают ценные боевые данные для улучшения разработки армейских доктрин."
 BLHM_ENG_develop_trade_with_usa:0 "Развитие торговли с США"
 BLHM_ENG_develop_trade_with_usa_desc:0 "Используем дипломатические каналы с США для того, чтобы компенсировать упадок экономики, вызванный Великой войной."
 BLHM_ENG_trade_with_usa_bonus:0 "Торговля с США — Промышленные исследования"
 BLHM_ENG_civilian_industrial_machinery:0 "Промышленные гражданские станки"
 BLHM_ENG_civilian_industrial_machinery_desc:0 "Используем дипломатические каналы с США для того, чтобы компенсировать упадок экономики, вызванный Великой войной."
 BLHM_ENG_civilian_machinery_bonus:0 "Гражданские станки — Промышленные исследования"
 BLHM_ENG_military_industrial_machinery:0 "Промышленные военные станки"
 BLHM_ENG_military_industrial_machinery_desc:0 "Используем дипломатические каналы с США для того, чтобы компенсировать упадок экономики, вызванный Великой войной."
 BLHM_ENG_oceania_treaty:0 "Договор об Океании"
 BLHM_ENG_oceania_treaty_desc:0 "Совместная инициатива по развитию гражданского сектора в Океании с США усилит нашу Империю."
 BLHM_ENG_joint_air_industry:0 "Совместные разработки в авиационной промышленности"
 BLHM_ENG_joint_air_industry_desc:0 "США направили группу учёных в нашу страну для разработки новейших типов истребителей."
 BLHM_ENG_joint_air_industry_bonus:0 "Совместная авиапромышленность — Авиационные исследования"
 BLHM_ENG_joint_resource_extraction:0 "Система совместной добычи ресурсов"
 BLHM_ENG_joint_resource_extraction_desc:0 "Совместная экономическая мощь двух мировых ведущих держав позволит нам удерживать лидирующие позиции на рынке ископаемых, а также полностью обеспечить внутренний рынок."
 BLHM_ENG_britain_prospers:0 "Процветай Британия"
 BLHM_ENG_britain_prospers_desc:0 "Мы вступаем в новую глобалистскую эру, наладив отношения с ключевыми Союзниками, и наша экономика готова к любым потрясениям!"
 BLHM_USA_trade_with_britain:0 "Развитие торговли с Великобританией"
 BLHM_USA_trade_with_britain_desc:0 "Британская торговля укрепила нашу экономику."
 BLHM_ENG_us_civilian_machinery:0 "Гражданские станки из США"
 BLHM_ENG_us_civilian_machinery_desc:0 "Американские чертежи ускорили строительство наших гражданских фабрик."
 BLHM_ENG_us_military_machinery:0 "Промышленные военные станки из США"
 BLHM_ENG_us_military_machinery_desc:0 "Американские промышленные методы увеличили наш военный производственный потенциал."
 BLHM_ENG_joint_oceania_development:0 "Развитие Океании совместно с США"
 BLHM_ENG_joint_oceania_development_desc:0 "Совместные гражданские проекты в Океании требуют временной экономической корректировки."

 BLHM_ENG_soviet_economic_compromise:0 "Советский экономический компромисс"
 BLHM_ENG_soviet_economic_compromise_desc:0 "Мы не любим коммунистов, но бедность любим ещё меньше."

 BLHM_ENG_soviet_heavy_weapons_experience:0 "Перенять советский опыт в разработке тяжёлого оружия"
 BLHM_ENG_soviet_heavy_weapons_experience_desc:0 "По праву у СССР одни из лучших орудий в мире на сегодняшний день. Отправим исследовательскую группу, чтобы перенять опыт разработки."
 BLHM_ENG_soviet_heavy_weapons_experience_bonus:0 "Советский опыт тяжёлого оружия — Исследование артиллерии"
 BLHM_ENG_soviet_compromise_accepted_required_tt:0 "§RСССР должен принять Советский экономический компромисс.§!"

 BLHM_ENG_simplify_production_lines:0 "Упрощение производственных линий"
 BLHM_ENG_simplify_production_lines_desc:0 "К нам попали упрощённые образцы армейского вооружения СССР. Применим их опыт в производстве собственного оружия."

 BLHM_ENG_sloped_armor:0 "Наклонная броня"
 BLHM_ENG_sloped_armor_desc:0 "Советский Союз одним из первых начал эффективно применять наклонную броню в своих танках. Такая броня выдерживает гораздо больше попаданий, нежели наши текущие разработки."
 BLHM_ENG_sloped_armor_tt:0 "§YНаклонная броня§! завершена. +10% к прорыву бронесил и +5% к броне будут интегрированы при появлении духа §Y«Новые танки»§!."

 BLHM_ENG_soviet_lend_lease:0 "Ленд-лиз СССР"
 BLHM_ENG_soviet_lend_lease_desc:0 "Нужно помочь Советскому Союзу в борьбе против Германии на материке."

 BLHM_ENG_quantity_over_quality:0 "Количество, а не качество"
 BLHM_ENG_quantity_over_quality_desc:0 "Упрощённые производственные методы снижают стоимость пехотного снаряжения за счёт индивидуального качества."

 BLHM_ENG_soviet_lend_lease_spirit:0 "Советский ленд-лиз"
 BLHM_ENG_soviet_lend_lease_spirit_desc:0 "Наши промышленные мощности частично переориентированы на производство поставок для советских военных усилий."

 BLHM_ENG_task.2.t:0 "Советский экономический компромисс"
 BLHM_ENG_task.2.d:0 "Британцы предлагают экономический компромисс: они построят заводы и поделятся индийским вольфрамом в обмен на доступ к нашим нефтяным месторождениям в Западном Азербайджане."
 BLHM_ENG_task.2.a:0 "Принять компромисс. Нашу нефть — за их промышленность."
 BLHM_ENG_task.2.b:0 "Отказаться. Нам не нужна британская благотворительность."

 BLHM_ENG_task.3.t:0 "Ежемесячный ленд-лиз Советскому Союзу"
 BLHM_ENG_task.3.d:0 "Наши конвои продолжают доставлять грузы в Советский Союз."
 BLHM_ENG_task.3.a:0 "Продолжить поставки."

 BLHM_ENG_fleet_of_britain:0 "Флот Британии"
 BLHM_ENG_fleet_of_britain_desc:0 "Королевский флот — могучая сила, но поддержание глобального превосходства ложится тяжёлым бременем на нашу промышленность и судостроение."
 BLHM_ENG_next_generation_fleet_idea:0 "Лёгкие корпуса нового поколения"
 BLHM_ENG_next_generation_fleet_idea_desc:0 "Передовые строительные технологии снижают стоимость лёгких корабельных корпусов."
 BLHM_ENG_faithful_to_tradition_idea:0 "Верность традициям"
 BLHM_ENG_faithful_to_tradition_idea_desc:0 "Наша приверженность тяжёлым капитальным кораблям остаётся непоколебимой. Атака тяжёлых и капитальных кораблей улучшена, исследования сверхтяжёлых линкоров ускорены."
 BLHM_ENG_anti_submarine_defence_idea:0 "Сеть противолодочной обороны"
 BLHM_ENG_anti_submarine_defence_idea_desc:0 "Скоординированная сеть средств обнаружения улучшает нашу способность находить вражеские подводные лодки."
 BLHM_ENG_carrier_groups_idea:0 "Доктрина авианосных групп"
 BLHM_ENG_carrier_groups_idea_desc:0 "Авианосные ударные группы — это будущее. Строительство авианосцев теперь значительно дешевле."
 BLHM_ENG_cost_optimisation_idea:0 "Оптимизация военно-морских расходов"
 BLHM_ENG_cost_optimisation_idea_desc:0 "Оптимизированные верфные операции снижают потребность в товарах народного потребления и ускоряют строительство ценой снижения атакующих способностей кораблей."
 BLHM_ENG_young_school_idea:0 "Доктрина Молодой школы"
 BLHM_ENG_young_school_idea_desc:0 "Доктрина лёгких сил: значительно улучшена атака экранов и лёгких кораблей, снижена стоимость строительства лёгких корпусов."
 BLHM_ENG_old_guard_idea:0 "Доктрина Старой гвардии"
 BLHM_ENG_old_guard_idea_desc:0 "Доктрина тяжёлых сил: значительно улучшена атака капитальных и тяжёлых кораблей, снижена стоимость строительства тяжёлых корпусов."
 BLHM_ENG_london_mk2_torpedoes_idea:0 "Торпеды класса London Mk2"
 BLHM_ENG_london_mk2_torpedoes_idea_desc:0 "Торпеды нового поколения с улучшенной вероятностью попадания, пробитием экранов и атакой морской авиации."
 BLHM_ENG_emergency_fleet_refit_idea:0 "Программа экстренного перевооружения флота"
 BLHM_ENG_emergency_fleet_refit_idea_desc:0 "Специализированная программа переоборудования значительно снижает стоимость модернизации существующих боевых кораблей."

 BLHM_ENG_naval_complex_bonus:0 "Военно-морской комплекс — Исследование эсминцев"
 BLHM_ENG_naval_modules_bonus:0 "Флот нового поколения — Корабельные модули"
 BLHM_ENG_asw_bonus:0 "Противолодочная оборона — Исследование ПЛО"
 BLHM_ENG_carrier_bonus:0 "Авианосные группы — Исследование авианосцев"
 BLHM_ENG_ss_ahead_bonus:0 "Подводная война — Опережающее исследование подлодок"

 BLHM_ENG_task.4.t:0 "Блокировка приоритета вооружённых сил истекла"
 BLHM_ENG_task.4.d:0 "Период эксклюзивного приоритета выбранной ветки вооружённых сил завершён. Теперь могут быть разработаны другие ветки."
 BLHM_ENG_task.4.a:0 "Принято."

 BLHM_ENG_d_day_preparations_cat:0 "Подготовка ко Дню Д"
 BLHM_ENG_prepare_recon_aircraft:0 "Подготовить разведывательную авиацию"
 BLHM_ENG_prepare_recon_aircraft_desc:0 "Подготовьте разведывательные самолёты для предстоящего вторжения. Задействует 3 гражданских фабрики на 56 дней и стоит 50 единиц политической власти. По завершении на склад поступает 50 разведсамолётов — их необходимо развернуть вручную в виде 5 × 10 крыльев."
 BLHM_ENG_prepare_recon_aircraft_tt:0 "§Y50 разведсамолётов§! добавлено на склад. Разверните вручную как 5 авиакрыльев по 10 самолётов.§!"

 BLHM_ENG_war_construction:0 "Военное строительство"
 BLHM_ENG_war_construction_desc:0 "Расширение военного потенциала — обязательная мера для мировой сверхдержавы."
 BLHM_ENG_naval_complex:0 "Военно-морской комплекс"
 BLHM_ENG_naval_complex_desc:0 "Создайте специальный военно-морской промышленный комплекс для координации развития надводного флота."
 BLHM_ENG_next_generation_fleet:0 "Флот нового поколения"
 BLHM_ENG_next_generation_fleet_desc:0 "Модернизируйте наши военно-морские проекты с использованием новейших модулей и начните строительство более лёгкого и универсального надводного флота."
 BLHM_ENG_faithful_to_tradition:0 "Верность традициям"
 BLHM_ENG_faithful_to_tradition_desc:0 "Чтите наследие Королевского флота, инвестируя в тяжёлые капитальные корабли и технологию сверхтяжёлых линкоров."
 BLHM_ENG_anti_submarine_defence:0 "Противолодочная оборона"
 BLHM_ENG_anti_submarine_defence_desc:0 "Угроза подводных лодок должна быть устранена. Инвестируйте в средства обнаружения и специализированные платформы ПЛО."
 BLHM_ENG_carrier_groups:0 "Авианосные группы"
 BLHM_ENG_carrier_groups_desc:0 "Воздушная мощь на море — это будущее. Развивайте палубную авиацию и снижайте стоимость производства авианосцев."
 BLHM_ENG_cost_optimisation:0 "Оптимизация затрат"
 BLHM_ENG_cost_optimisation_desc:0 "Оптимизируйте военно-морские закупки и верфные операции. Примите снижение боевых характеристик ради повышения промышленной эффективности."
 BLHM_ENG_submarine_warfare:0 "Подводная война"
 BLHM_ENG_submarine_warfare_desc:0 "Под волнами скрывается наше асимметричное преимущество. Ускорьте развитие подводных технологий."
 BLHM_ENG_young_school:0 "Молодая школа"
 BLHM_ENG_young_school_desc:0 "Новое поколение военно-морских офицеров выступает за быстрые лёгкие надводные силы. Примите скорость и современную тактику лёгких кораблей."
 BLHM_ENG_old_guard:0 "Старая гвардия"
 BLHM_ENG_old_guard_desc:0 "Проверенные в боях адмиралы утверждают, что большие орудия и тяжёлая броня остаются основой морской мощи. Держите строй."
 BLHM_ENG_london_mk2_torpedoes:0 "Торпеды класса London Mk2"
 BLHM_ENG_london_mk2_torpedoes_desc:0 "Инвестируйте в программу торпед нового поколения. Улучшенные торпеды дадут нашим кораблям и морской авиации решающее преимущество."
 BLHM_ENG_emergency_fleet_refit:0 "Программа экстренного перевооружения флота"
 BLHM_ENG_emergency_fleet_refit_desc:0 "Создайте программу экстренного переоборудования для модернизации существующих корпусов с долей затрат от стоимости нового строительства."
 BLHM_ENG_expand_british_dockyards:0 "Расширение британских верфей"
 BLHM_ENG_expand_british_dockyards_desc:0 "Наши верфи работают на пределе. Постройте новые мощности в ключевых прибрежных провинциях для поддержки расширяющегося флота."
 BLHM_ENG_prepare_for_d_day:0 "Подготовка ко Дню Д"
 BLHM_ENG_prepare_for_d_day_desc:0 "Освобождение Европы требует беспрецедентной военно-морской подготовки. Откройте особые решения для организации вторжения."

 BLHM_ENG_air_industry:0 "Авиационная промышленность"
 BLHM_ENG_air_industry_desc:0 "Создайте специализированный авиационный промышленный комплекс для координации развития наших военно-воздушных сил."
 BLHM_ENG_light_air_development:0 "Развитие малой авиации"
 BLHM_ENG_light_air_development_desc:0 "Сосредоточьтесь на разработке лёгких истребителей и штурмовиков для поддержания превосходства в воздухе."
 BLHM_ENG_medium_air_development:0 "Развитие средней авиации"
 BLHM_ENG_medium_air_development_desc:0 "Инвестируйте в средние бомбардировщики и многоцелевые самолёты для стратегической гибкости."
 BLHM_ENG_heavy_air_development:0 "Развитие тяжёлой авиации"
 BLHM_ENG_heavy_air_development_desc:0 "Разрабатывайте стратегические бомбардировщики для проекции силы далеко за пределы наших берегов."
 BLHM_ENG_carrier_air_development:0 "Развитие палубной авиации"
 BLHM_ENG_carrier_air_development_desc:0 "Палубная авиация — будущее флотского боя. Разработайте специализированные самолёты для авианосцев."
 BLHM_ENG_air_production_modernisation:0 "Модернизация производства"
 BLHM_ENG_air_production_modernisation_desc:0 "Модернизируйте линии производства самолётов для снижения затрат и увеличения выпуска."
 BLHM_ENG_pilot_training_programme:0 "Программа обучения пилотов"
 BLHM_ENG_pilot_training_programme_desc:0 "Создайте комплексную программу подготовки пилотов для повышения их квалификации и эффективности."
 BLHM_ENG_next_generation_ground_attack:0 "Штурмовая авиация нового поколения"
 BLHM_ENG_next_generation_ground_attack_desc:0 "Разработайте передовые штурмовики и тактики для обеспечения непревзойдённой поддержки с воздуха."
 BLHM_ENG_aircraft_machine_tools:0 "Авиационные станки"
 BLHM_ENG_aircraft_machine_tools_desc:0 "Инвестируйте в специализированные станки для точного производства самолётов."
 BLHM_ENG_aircraft_machine_tools_bonus:0 "Авиационные станки — Промышленные исследования"
 BLHM_ENG_new_industrial_schemes:0 "Новые промышленные схемы"
 BLHM_ENG_new_industrial_schemes_desc:0 "Внедрите инновационные промышленные схемы для улучшения производства Supermarine и Spitfire."
 BLHM_ENG_raf_exercises:0 "Учения ВВС"
 BLHM_ENG_raf_exercises_desc:0 "Проводите интенсивные учения Королевских ВВС для улучшения подготовки пилотов и эффективности асов."
 BLHM_ENG_defence_of_britain:0 "Оборона Британии"
 BLHM_ENG_defence_of_britain_desc:0 "Оборона нашей родины требует максимальных усилий. Укрепите истребительную оборону и оптимизируйте производство."
 BLHM_ENG_heavy_bombs_and_modified_mounts:0 "Тяжёлые бомбы и модифицированные узлы"
 BLHM_ENG_heavy_bombs_and_modified_mounts_desc:0 "Разработайте тяжёлые бомбы и модифицированные узлы для сокрушительных наземных атак."
 BLHM_ENG_heavy_bombs_bonus:0 "Тяжёлые бомбы — Исследование средней авиации"
 BLHM_ENG_heavy_bombs_sp_tt:0 "§YТяжёлые бомбы§! Открывает спецпроект §H«Прыгающая бомба»§!."
 BLHM_ENG_gloster_meteor:0 "Gloster Meteor"
 BLHM_ENG_gloster_meteor_desc:0 "Разработайте первый британский реактивный истребитель — Gloster Meteor — с революционным осевым реактивным двигателем."
 BLHM_ENG_gloster_meteor_tt:0 "§YGloster Meteor§!\nЗавершает спецпроект §H«Осевой реактивный двигатель»§!.\nОткрывает технологию улучшенного малого планера.\nСоздаёт вариант Gloster Meteor: small_plane_airframe_2 с jet_engine_axial_1x, heavy_mg_4x, aircraft_cannon_2_1x и drop_tanks.\nМодуль осевого реактивного двигателя получает +15% к стоимости и +20% к потреблению топлива."

 BLHM_ENG_medium_air_idea:0 "Программа средней авиации"
 BLHM_ENG_medium_air_idea_desc:0 "Наш флот средних бомбардировщиков получает улучшенное управление и контроль, повышающие эффективность миссий."
 BLHM_ENG_heavy_air_idea:0 "Программа тяжёлой авиации"
 BLHM_ENG_heavy_air_idea_desc:0 "Уточнённая доктрина стратегических бомбардировок — снижение стоимости производства тяжёлых бомбардировщиков и увеличение радиуса действия."
 BLHM_ENG_carrier_air_idea:0 "Программа палубной авиации"
 BLHM_ENG_carrier_air_idea_desc:0 "Программа разработки палубной авиации снижает производственные затраты и улучшает возможности морского удара."
 BLHM_ENG_air_production_modernisation_idea:0 "Модернизация авиапроизводства"
 BLHM_ENG_air_production_modernisation_idea_desc:0 "Оптимизированные производственные линии снижают стоимость малых планеров."
 BLHM_ENG_pilot_training_idea:0 "Программа обучения пилотов"
 BLHM_ENG_pilot_training_idea_desc:0 "Улучшенная подготовка пилотов повышает эффективность истребителей и перехвата ценой увеличения стоимости производства малых самолётов."
 BLHM_ENG_next_gen_ground_attack_idea:0 "Штурмовая авиация нового поколения"
 BLHM_ENG_next_gen_ground_attack_idea_desc:0 "Передовая тактика штурмовок и боеприпасы повышают эффективность поддержки с воздуха."
 BLHM_ENG_raf_exercises_idea:0 "Учения Королевских ВВС"
 BLHM_ENG_raf_exercises_idea_desc:0 "Регулярные интенсивные учения ускоряют подготовку пилотов и повышают эффективность асов."
 BLHM_ENG_defence_of_britain_idea:0 "Оборона Британии"
 BLHM_ENG_defence_of_britain_idea_desc:0 "Оптимизированная тактика оборонительных истребителей дополнительно улучшает эффективность перехвата и частично компенсирует затраты на обучение."
 BLHM_ENG_mio_fallback_production:0 "Производственная оптимизация Supermarine"
 BLHM_ENG_mio_fallback_production_desc:0 "Производственные линии Supermarine оптимизированы — стоимость малых планеров снижена."
 BLHM_ENG_mio_fallback_defence:0 "Оборонительные усовершенствования Supermarine"
 BLHM_ENG_mio_fallback_defence_desc:0 "Улучшения защиты Supermarine повышают живучесть наших самолётов."

 BLHM_ENG_light_air_bonus:0 "Развитие малой авиации — Исследование лёгкой авиации"

 BLHM_ENG_task.5.t:0 "Период авиационного приоритета истёк"
 BLHM_ENG_task.5.d:0 "Период эксклюзивного приоритета авиационной ветки вооружённых сил завершён. Теперь могут быть разработаны другие ветки."
 BLHM_ENG_task.5.a:0 "Принято."
 BLHM_ENG_task.6.t:0 "Время восстановления авиационных фокусов истекло"
 BLHM_ENG_task.6.d:0 "Период восстановления для продвинутых авиационных фокусов завершён. Теперь может быть выбран новый фокус."
 BLHM_ENG_task.6.a:0 "Отлично."
 BLHM_ENG_task.7.t:0 "Новые промышленные схемы"
 BLHM_ENG_task.7.d:0 "Наши инженеры разработали новые промышленные схемы для Supermarine. Выберите направление программы."
 BLHM_ENG_task.7.a:0 "Производственная оптимизация — снижение стоимости малых самолётов на 10%"
 BLHM_ENG_task.7.b:0 "Оборонительные усовершенствования — повышение защиты на 10%"

 BLHM_ENG_land_forces:0 "Сухопутные войска"
 BLHM_ENG_land_forces_desc:0 "Расширение потенциала нашей армии — необходимая мера для мировой державы. Создаёт программу обучения для всех союзников и снабжает наши заводы."
 BLHM_ENG_tank_development:0 "Развитие танкостроения"
 BLHM_ENG_tank_development_desc:0 "Инвестируйте в разработку бронетехники. Выберите одного из доминионов для руководства исследованиями в рамках программы «Новые танки»."
 BLHM_ENG_infantry_forces:0 "Пехотные войска"
 BLHM_ENG_infantry_forces_desc:0 "Укрепите нашу пехоту новым снаряжением и тактикой, ускоряя исследования оружия и расширяя производственные мощности."
 BLHM_ENG_infantry_forces_bonus:0 "Пехотные войска — Исследование оружия"

 BLHM_ENG_study_french_conflict_experience:0 "Изучить опыт Франции в конфликте"
 BLHM_ENG_study_french_conflict_experience_desc:0 "Трудные уроки Франции в бронетанковой войне бесценны. Внедрите их опыт, чтобы улучшить мобильность наших танков."
 BLHM_ENG_seventeen_pounder:0 "17-фунтовое орудие"
 BLHM_ENG_seventeen_pounder_desc:0 "Разработайте мощное 17-фунтовое противотанковое орудие, значительно улучшающее бронебойные возможности наших танков."
 BLHM_ENG_sherman_firefly:0 "Шерман Файрфлай"
 BLHM_ENG_sherman_firefly_desc:0 "Установите 17-фунтовое орудие на американский шасси «Шерман», создав эффективный истребитель танков с производственными преимуществами."
 BLHM_ENG_global_tank_doctrine_update:0 "Глобальное обновление танковой доктрины"
 BLHM_ENG_global_tank_doctrine_update_desc:0 "Стандартизируйте производство танков и тактическую доктрину по всей Империи, снижая затраты и повышая промышленную эффективность."
 BLHM_ENG_updated_communications:0 "Обновлённые системы связи"
 BLHM_ENG_updated_communications_desc:0 "Оснастите наши бронетанковые соединения современными радиостанциями и протоколами координации для улучшения управления и контроля."

 BLHM_ENG_canadian_landings:0 "Канадский десант"
 BLHM_ENG_canadian_landings_desc:0 "Обучите и оснастите канадские силы для десантных операций, улучшая возможности морского десантирования и боевую эффективность морской пехоты."
 BLHM_ENG_african_infantry_corps:0 "Африканский пехотный корпус"
 BLHM_ENG_african_infantry_corps_desc:0 "Создайте специальный африканский пехотный корпус с улучшенной мобильностью, организацией и оборонительной тактикой."
 BLHM_ENG_indian_gurkhas:0 "Индийские гурки"
 BLHM_ENG_indian_gurkhas_desc:0 "Наберите и оснастите полки гуркхов, известных своей яростью в ближнем бою, с усиленной артиллерийской поддержкой и сниженным потреблением снабжения."
 BLHM_ENG_australian_rangers:0 "Австралийские рейнджеры"
 BLHM_ENG_australian_rangers_desc:0 "Разработайте элитные подразделения рейнджеров из австралийского буша, обученные для самостоятельных операций с превосходными боевыми навыками."
 BLHM_ENG_new_zealand_special_forces:0 "Новозеландский спецназ"
 BLHM_ENG_new_zealand_special_forces_desc:0 "Сформируйте специализированные новозеландские подразделения коммандос для рейдов и спецопераций в тылу врага."

 BLHM_ENG_new_cadres_training:0 "Программа обучения новых кадров"
 BLHM_ENG_new_cadres_training_desc:0 "Комплексная программа обучения новых офицерских кадров, ускоряющая развитие армейских доктрин по всему альянсу."
 BLHM_ENG_allied_tanks:0 "Танки Союзников"
 BLHM_ENG_allied_tanks_desc:0 "Совместная танковая программа под британским руководством. Сложность координации снижает мобильность и надёжность, но улучшает броню и огневую мощь."
 BLHM_ENG_new_tanks_CAN:0 "Новые танки — Канада"
 BLHM_ENG_new_tanks_CAN_desc:0 "Канадская программа развития танков. Сложность снижает мобильность и надёжность, но улучшает броню и огневую мощь."
 BLHM_ENG_new_tanks_SAF:0 "Новые танки — ЮАС"
 BLHM_ENG_new_tanks_SAF_desc:0 "Южноафриканская программа развития танков. Сложность снижает мобильность и надёжность, но улучшает броню и огневую мощь."
 BLHM_ENG_new_tanks_RAJ:0 "Новые танки — Индия"
 BLHM_ENG_new_tanks_RAJ_desc:0 "Индийская программа развития танков. Сложность снижает мобильность и надёжность, но улучшает броню и огневую мощь."
 BLHM_ENG_new_tanks_AST:0 "Новые танки — Австралия"
 BLHM_ENG_new_tanks_AST_desc:0 "Австралийская программа развития танков. Сложность снижает мобильность и надёжность, но улучшает броню и огневую мощь."
 BLHM_ENG_new_tanks_NZL:0 "Новые танки — Новая Зеландия"
 BLHM_ENG_new_tanks_NZL_desc:0 "Новозеландская программа развития танков. Сложность снижает мобильность и надёжность, но улучшает броню и огневую мощь."

 BLHM_ENG_joint_tank_upgrade:0 "Совместное танковое усовершенствование"
 BLHM_ENG_joint_tank_upgrade_desc:0 "Англо-французское сотрудничество улучшило противотанковую и противопехотную огневую мощь."
 BLHM_ENG_sloped_armor_upgrade:0 "Наклонная броня"
 BLHM_ENG_sloped_armor_upgrade_desc:0 "Внедрение наклонной брони по советскому опыту улучшает защиту от бронебойных снарядов."

 BLHM_ENG_canadian_landings_idea:0 "Канадский десантный корпус"
 BLHM_ENG_canadian_landings_idea_desc:0 "Специализированные канадские десантные силы. Скорость планирования вторжений и боевая эффективность морской пехоты значительно улучшены."
 BLHM_ENG_african_infantry_corps_idea:0 "Африканский пехотный корпус"
 BLHM_ENG_african_infantry_corps_idea_desc:0 "Африканский пехотный корпус — высокомобильная и хорошо организованная оборонительная сила, способная к быстрому развёртыванию."
 BLHM_ENG_indian_gurkhas_idea:0 "Индийские полки гуркхов"
 BLHM_ENG_indian_gurkhas_idea_desc:0 "Полки гуркхов легендарны своей доблестью в ближнем бою. Получают усиленную артиллерийскую поддержку, сниженное потребление снабжения и дешёвое пехотное снаряжение."
 BLHM_ENG_australian_rangers_idea:0 "Австралийские рейнджеры"
 BLHM_ENG_australian_rangers_idea_desc:0 "Элитные австралийские рейнджеры превосходят в самостоятельных операциях с улучшенной атакой, защитой и организацией. Модификаторы применяются к спецназу."
 BLHM_ENG_new_zealand_special_forces_idea:0 "Новозеландский спецназ"
 BLHM_ENG_new_zealand_special_forces_idea_desc:0 "Новозеландский спецназ высоко обучен для рейдовых операций с элитными показателями атаки и защиты."

 BLHM_ENG_task.8.t:0 "Период приоритета сухопутных войск истёк"
 BLHM_ENG_task.8.d:0 "Период эксклюзивного приоритета сухопутной ветки вооружённых сил завершён. Теперь могут быть разработаны другие ветки."
 BLHM_ENG_task.8.a:0 "Принято."
 BLHM_ENG_task.9.t:0 "Время восстановления сухопутной специализации истекло"
 BLHM_ENG_task.9.d:0 "Период восстановления для фокусов сухопутной специализации завершён. Теперь может быть выбрана новая специализация."
 BLHM_ENG_task.9.a:0 "Отлично."
 BLHM_ENG_task.10.t:0 "Программа «Новые танки» — Выбор получателя"
 BLHM_ENG_task.10.d:0 "Наша программа развития танков готова. Мы должны выбрать один из доминионов для руководства производством и получения статуса «Новые танки»."
 BLHM_ENG_task.10.can:0 "Канада — Канадские бронетанковые дивизии"
 BLHM_ENG_task.10.saf:0 "ЮАС — Танковый корпус ЮАС"
 BLHM_ENG_task.10.raj:0 "Индия — Индийские бронетанковые полки"
 BLHM_ENG_task.10.ast:0 "Австралия — Австралийские бронетанковые силы"
 BLHM_ENG_task.10.nzl:0 "Новая Зеландия — Новозеландская бронетанковая бригада"
 BLHM_ENG_task.10.none:0 "Нет подходящего доминиона для программы «Новые танки»."

 BLHM_ENG_canadian_landings_sf_doctrine_tt:0 "§YКанадский десант§! также даёт Канаде §Y40%§! снижение стоимости исследований доктрин спецназа."}]}
 BLHM_ENG_tank_development_tt:0 "Даёт §Y2 военных завода§! и запускает ивент §YТанки Союзников§! с последующим выбором получателя §YНовых Танков§! среди доминионов. Начинает 365-дневную специализацию сухопутных войск."
 BLHM_ENG_study_french_conflict_experience_tt:0 "Усиливает национальный дух §YНовые Танки§!: §Y+15%§! к скорости передвижения бронетехники."
 BLHM_ENG_seventeen_pounder_tt:0 "Усиливает национальный дух §YНовые Танки§!: §Y+15%§! хард-атаки бронетехники."
 BLHM_ENG_sherman_firefly_tt:0 "Усиливает национальный дух §YНовые Танки§!: §Y−25%§! стоимости производства средних танков, §Y+7%§! максимальная эффективность производства."
 BLHM_ENG_global_tank_doctrine_update_tt:0 "Усиливает национальный дух §YНовые Танки§!: §Y−15%§! стоимости для всей бронетехники (фактически убирает изначальный дебафф); §Y+5%§! максимальная эффективность производства."
 BLHM_ENG_updated_communications_tt:0 "Усиливает национальный дух §YНовые Танки§!: §Y+15%§! организации танков и §Y+4%§! координации."
