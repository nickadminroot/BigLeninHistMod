l_russian:
 BLHM_ENG_civilian_construction:0 "Гражданское строительство"
 BLHM_ENG_civilian_construction_desc:0 "Важно расширять промышленные мощности страны на благо жителей нашего государства."
 BLHM_ENG_strengthen_ties_with_france:0 "Усиление связей с Францией"
 BLHM_ENG_strengthen_ties_with_france_desc:0 "Возможно, когда-то у нас были разногласия с Францией, но теперь мы должны стоять вместе перед лицом растущих угроз. Совместная экономическая программа принесёт пользу обеим нациям."
 BLHM_ENG_strengthen_ties_france_tt:0 "Строительство во французских североафриканских провинциях требует существования Франции и её контроля над этими территориями."
 BLHM_ENG_french_bases_in_commonwealth:0 "Французские военные базы в Австралии и Индии"
 BLHM_ENG_french_bases_in_commonwealth_desc:0 "Сохраняется напряжённость в Азиатском регионе. Нужно объединить усилия с нашими коллегами из Франции для того, чтобы стать единым фронтом против возрастающей угрозы со стороны Японии."
 BLHM_ENG_aid_china:0 "Помощь Китаю"
 BLHM_ENG_aid_china_desc:0 "Китай может стать сдерживающим фактором. Поможем им в войне с Японией."
 BLHM_ENG_british_specialists_in_china:0 "Британские специалисты в Китае"
 BLHM_ENG_british_specialists_in_china_desc:0 "Нам нужно детальнее изучить боевые действия в Китае, чтобы улучшить доктрины ведения войны, которые не менялись с Великой войны."
 BLHM_ENG_african_railway_project:0 "Проект Африканской железной дороги"
 BLHM_ENG_african_railway_project_desc:0 "Африка — это сундук с золотом, который только и ждёт, чтобы его забрали. Но сундук нужно как-то увезти. Совместный проект железной дороги с Францией позволит усилить нашу торговлю в этом регионе."
 BLHM_ENG_african_railway_tt:0 "Запланирован железнодорожный маршрут 3-го уровня от Касабланки до Кейптауна вдоль подконтрольного союзникам атлантического побережья. Полное непрерывное соединение зависит от союзного контроля над промежуточными провинциями."
 BLHM_ENG_joint_radar_development:0 "Совместные разработки радаров"
 BLHM_ENG_joint_radar_bonus:0 "Бонус совместной разработки радаров"
 BLHM_ENG_joint_radar_development_desc:0 "Передовые технологии, связанные с электромагнитными волнами, позволят нам узнавать о подлёте противника, как только он поднял авиацию в воздух."
 BLHM_ENG_national_prosperity_treaty:0 "Договор национального процветания"
 BLHM_ENG_national_prosperity_treaty_desc:0 "Исторический совместный договор с Францией укрепляет наши экономические основы — снижая потребности товаров народного потребления, ускоряя строительство фабрик и повышая национальную стабильность."
 BLHM_ENG_joint_tank_development:0 "Совместные танковые разработки"
 BLHM_ENG_joint_tank_development_desc:0 "Возможность перенять опыт коллег из Парижа — это подарок судьбы, ведь их Somua S35 и Char B1 считаются одними из лучших танков в мире."
 BLHM_ENG_joint_tank_development_tt:0 "§YСовместные танковые разработки§! завершены. +7% к противотанковой атаке и +5% к противопехотной атаке будут интегрированы при появлении духа §Y«Новые танки»§!."
 BLHM_ENG_syrian_alexandrian_corps:0 "Сирийско-Александрийский корпус"
 BLHM_ENG_syrian_alexandrian_corps_desc:0 "Мы проводим учения в экстремальных условиях Союзников, чтобы лучше защищать наши территории. Совместная подготовка в пустыне повышает оборону и мобильность пехоты на любой местности."
 BLHM_ENG_task.1.t:0 "Совместная программа разработки радаров"
 BLHM_ENG_task.1.d:0 "Наши британские союзники завершили совместную программу разработки радаров. Их учёные делятся с нами прорывом, предоставляя значительное преимущество в исследованиях радарных технологий."
 BLHM_ENG_task.1.a:0 "Отлично! Наши радарные технологии совершат скачок!"
 BLHM_CHI_british_advisers:0 "Британские советники"
 BLHM_CHI_british_advisers_desc:0 "Британские военные советники обучают наши войска, повышая боевую эффективность пехоты и способность к укреплению позиций."
 BLHM_ENG_china_doctrine_observers:0 "Наблюдатели за китайской доктриной"
 BLHM_ENG_china_doctrine_observers_desc:0 "Наши наблюдатели в Китае собирают ценные боевые данные для улучшения разработки армейских доктрин."
