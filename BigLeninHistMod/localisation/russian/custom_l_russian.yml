 filler_national_focus:0 "Заполняющий фокус"
 fleet_costs_modifier:0 "Расходы на флот"
 fleet_costs_modifier_desc:0 "Наши морские амбиции напрямую отражаются на бюджете страны, все больше предприятий будет требоваться для обработки металла, создания орудий, логистики и финансирования проектов. Чем сильнее мы хотим стать морской державой номер 1 в мире - тем сильнее это будет сказываться на потенциале нашей промышленности."
 allied_africa_control_modifier:0 "Контроль Африки (Союзники)"
 allied_africa_control_modifier_desc:0 "Контроль над африканскими территориями даёт промышленные бонусы. Каждая контролируемая территория сверх оси даёт +0.5% к промышленной мощности и эффективности производства."
 axis_africa_control_modifier:0 "Контроль Африки (Ось)"
 axis_africa_control_modifier_desc:0 "Контроль над африканскими территориями даёт промышленные бонусы. Каждая контролируемая территория сверх союзников даёт +0.5% к промышленной мощности и эффективности производства."
 ENG_iraq_under_control:0 "Ирак под контролем"
 ENG_iraq_under_control_desc:0 "Контроль над Ираком обеспечивает доступ к дополнительным нефтяным ресурсам, увеличивая производство топлива."
 STRATEGICREGION_299:0 "Западный Египет"
 STRATEGICREGION_300:0 "Южный Египет"
 BLHM_GER_invest_in_italian_industry:0 "Инвестиции в промышленность Италии"
 BLHM_GER_invest_in_italian_industry_desc:0 "Италия промышленно слишком слаба, чтобы быть надежным союзником. Нужно как можно быстрее помочь ей перейти на военные рельсы."
 BLHM_GER_libyan_industry:0 "Ливийская промышленность"
 BLHM_GER_libyan_industry_desc:0 "Изыскание и разработка месторождений, богатых ресурсами Ливии, позволит получить дополнительные материалы для поддержки военной машины."
 BLHM_GER_spanish_african_bases:0 "Договор с Испанией об Африканских базах"
  BLHM_GER_spanish_african_bases_desc:0 "Чтобы эффективно разгружать торговые пути противников, нужна глубокая логистика. Нейтральный статус Испании играет нам на руку: союзники не смогут атаковать их базы, а немецкий флот сможет швартоваться и ремонтироваться в испанских портах."
 BLHM_GER_prepare_east_african_sabotage:0 "Подготовить диверсии в Восточной Африке"
 BLHM_GER_prepare_east_african_sabotage_desc:0 "Германия подготовит нарушение путей снабжения национальных противников, чтобы быть лучше подготовленной к Африканской кампании."
 BLHM_GER_prepare_east_african_sabotage_tt:0 "Открывает решение §YПлан Скорпион§! после вступления Италии в войну."
 BLHM_GER_mediterranean_exercises:0 "Средиземноморские учения"
 BLHM_GER_mediterranean_exercises_desc:0 "Командование постановило, что для ведения войны на нескольких фронтах нужно лучше подготовить союзников к надвигающейся войне."
 BLHM_ITA_german_industrial_aid:0 "Немецкая промышленная помощь"
 BLHM_ITA_german_industrial_aid_desc:0 "Германские инвестиции и специалисты помогают Италии ускорить переход промышленности на военные рельсы."
 BLHM_GER_investments_in_libya:0 "Инвестиции в Ливию"
 BLHM_GER_investments_in_libya_desc:0 "Разработка ливийских месторождений требует временного отвлечения германских строительных и промышленных ресурсов."
 BLHM_GER_german_army_training:0 "Немецкая армейская подготовка"
 BLHM_GER_german_army_training_desc:0 "Германские инструкторы готовят армию к войне на широком средиземноморском театре."
 GER_mediterranean_operations_cat:0 "Средиземноморские операции"
 BLHM_GER_plan_scorpion:0 "План Скорпион"
 BLHM_GER_plan_scorpion_desc:0 "Мы готовы совершить диверсию на железных дорогах Союзников в Африканском регионе, чтобы временно нарушить логистические маршруты противника."
 BLHM_GER_plan_scorpion_effect_tt:0 "Подрывает все железные дороги, хабы снабжения и порты в выбранных регионах Восточной Африки."
 GER_wunderwaffe_branch_lock_flag:0 "Блокировка ветки WunderWaffe"
 GER_wunderwaffe_e50_unification_ready_flag:0 "Готовность унификации E-50"
 GER_wunderwaffe:0 "Начать разработку WunderWaffe"
 GER_wunderwaffe_desc:0 "Германии нужен решающий прорыв. Отдельное исследовательское подразделение займется самыми передовыми оружейными проектами Рейха."
 GER_wunderwaffe_me262:0 "Me-262"
 GER_wunderwaffe_me262_desc:0 "Германия должна господствовать в небе с новым поколением реактивных самолетов."
 GER_wunderwaffe_rotte:0 "Rotte"
 GER_wunderwaffe_rotte_desc:0 "Сухопутный крейсер на первый взгляд звучит абсурдно, но командование видит потенциал такой машины."
 GER_wunderwaffe_maus:0 "Maus"
 GER_wunderwaffe_maus_desc:0 "Германия будет господствовать на поле боя с новым классом сверхтяжелых танков."
 GER_wunderwaffe_e50:0 "E-50"
 GER_wunderwaffe_e50_desc:0 "Нужно унифицировать производство танков, чтобы максимизировать число машин, сходящих с конвейера каждый месяц."
 GER_wunderwaffe_e50_unification:0 "E-50 Унификация"
 GER_wunderwaffe_e50_unification_desc:0 "Стандартизация убирает дублирование и возвращает промышленную эффективность."
 GER_uranverein:0 "Uranverein"
 GER_uranverein_desc:0 "Германии нужно овладеть оружием следующего поколения, чтобы навсегда закрепить свое господство в мире."
 GER_amerikabomber:0 "AmerikaBomber"
 GER_amerikabomber_desc:0 "Германии нужен самолет, способный достичь любой точки земного шара."
 GER_wunderwaffe_development_idea:0 "Разработка WunderWaffe"
 GER_wunderwaffe_development_idea_desc:0 "Отдельное исследовательское подразделение концентрирует лучших умов Рейха на самых передовых оружейных проектах."
 GER_wunderwaffe_investments_idea:0 "Инвестиции в WunderWaffe"
 GER_wunderwaffe_investments_idea_desc:0 "Перенаправление ресурсов в экспериментальное оружие замедляет промышленность, усиливает потребительское давление и закаляет военную мобилизацию."
 BLHM_GER_wunderwaffe_program:0 "Wunderwaffe"
 BLHM_GER_wunderwaffe_program_desc:0 "Танковая и ракетная программы готовы стать основой отдельной ветки чудо-оружия."
 BLHM_GER_last_effort_cat:0 "Из последних сил"
 BLHM_GER_mobilize_volkssturm:0 "Мобилизовать дивизии фольксштурма"
 BLHM_GER_mobilize_volkssturm_desc:0 "Созвать чрезвычайные формирования фольксштурма. Каждая мобилизация усиливает еженедельное давление на стабильность."
 BLHM_GER_last_effort_modifier:0 "Из последних сил"
 BLHM_GER_last_effort_modifier_desc:0 "Чрезвычайная мобилизация удерживает больше людей на фронте, но страна платит за это каждую неделю."
 BLHM_GER_high_naval_expenses_modifier:0 "Высокие затраты на флот"
 BLHM_GER_high_naval_expenses_modifier_desc:0 "Быстрое расширение флота отвлекает материалы, заводы и строительные мощности от военной экономики."
 GER_noveyshie_tankovye_razrabotki_idea:0 "Новейшие танковые разработки"
 GER_noveyshie_tankovye_razrabotki_idea_desc:0 "Новый стандарт танков улучшает будущий выпуск, но делает современное шасси заметно дороже в производстве."
 GER_heavy_water_supplies_stable:0 "Поставки тяжелой воды стабильны"
 GER_heavy_water_supplies_stable_desc:0 "Надежный доступ к тяжелой воде поддерживает ядерную программу."
 GER_heavy_water_supplies_shortage:0 "Дефицит тяжелой воды"
 GER_heavy_water_supplies_shortage_desc:0 "Поставки тяжелой воды сорваны, что резко замедляет ядерную программу."
 BLHM_GER_develop_portuguese_mining:0 "Развитие добычи в Португалии"
 BLHM_GER_develop_portuguese_mining_desc:0 "Наша военная машина требует все большего количества ресурсов, а текущие объемы добычи наших партнеров не справляются. Высшее руководство предложило расширить месторождения в Португалии с целью получения большего объема вольфрама для наших танков"
 BLHM_GER_develop_portuguese_mining_tt:0 "Португалия получает все технологии раскопки ресурсов.\nГермания получает национальный дух §YИнвестиции в фокус§! на §Y60 дней§!: §YТовары народного потребления§!: §Y+10.0%§!."
 BLHM_GER_portuguese_mining_investments:0 "Инвестиции в фокус"
 BLHM_GER_portuguese_mining_investments_desc:0 "Расширение португальской добычи требует временного отвлечения гражданской промышленности."
 BLHM_GER_ss_police_unlocked_tt:0 "Открывает роту поддержки §YПолиция СС§!. Ее подавление сопротивления в 1.5 раза выше, чем у обычной военной полиции."
 BLHM_GER_ss_police_tech:0 "Полиция СС"
 BLHM_GER_ss_police_tech_desc:0 "Специализированные полицейские части СС для подавления сопротивления на оккупированных территориях."
 ss_police:0 "Полиция СС"
 ss_police_desc:0 "Специализированная рота поддержки СС для подавления сопротивления на оккупированных территориях."
 ITA_bersaglieri_re_tt:0 "§YСпецвойска§! Атака: §G+10%§!\n§YСпецвойска§! Защита: §G+10%§!"
 ITA_decima_flottiglia_mas_rm_tt:0 "Эффективность перехвата конвоев: §G+5%§!\nШанс критического урона: §G+5%§!\nСкорость отступления подлодок: §G+5%§!"
 ITA_ferrea_mole_ferreo_cuore_armor_tt:0 "§YВся бронетехника§! Атака: §G+10%§!"
 ITA_improve_overseas_naval_bases_tt:0 "Военно-морские базы §YТриполи§! и §YБенгази§! улучшены до §Y10 уровня§!.\nПостроены береговые укрепления в обоих локациях."
 ITA_increase_production_military_industry_tt:0 "Выпуск военных заводов: §G+5%§!\nМакс. эффективность производства: §G+5%§!\nСохранение эффективности: §G+20%§!\nРост эффективности: §R-4%§!"
 ITA_keep_specialization_military_industry_tt:0 "Выпуск военных заводов: §G+5%§!\nРост эффективности: §G+10%§!\nБазовая эффективность: §G+10%§!\nСохранение эффективности: §R-20%§!"
 ITA_long_range_aircraft:0 "Авиация дальнего действия"
 ITA_long_range_aircraft_desc:0 "Развитие авиации дальнего действия позволит наносить удары по стратегическим целям противника на больших расстояниях."
 ITA_bomber_designs:0 "Проекты бомбардировщиков"
 ITA_bomber_designs_desc:0 "Специализированные проекты бомбардировщиков для нанесения ударов по морским целям."
 ITA_fighter_designs:0 "Проекты истребителей"
 ITA_fighter_designs_desc:0 "Создание новых истребителей с улучшенными характеристиками маневренности и атаки."
 ITA_multirole_aircraft:0 "Многоцелевой самолёт"
 ITA_multirole_aircraft_desc:0 "Разработка многоцелевых самолётов для выполнения различных боевых задач."
 ITA_long_range_aircraft_idea:0 "Авиация дальнего действия"
 ITA_bomber_designs_idea:0 "Проекты бомбардировщиков"
 ITA_G55_centauro_idea:0 "G.55 Центaуро"
 ITA_multirole_aircraft_idea:0 "Многоцелевой самолёт"
 ITA_hidden_standardization_ns:0 "Стоимость производства истребителей: §G-10%§!\nВероятность летных происшествий: §R+10%§!"
 ITA_hidden_specialization_ns:0 "Стоимость производства истребителей: §G-10%§!\nВероятность летных происшествий: §R+10%§!"
 ITA_hidden_spg_production_ns:0 "§Y§!Снижение стоимости самоходных орудий §G-10%§!"
 ITA_hidden_ferrea_mole_ns:0 "§Y§!Ferrea Mole"
  wuw_HUN_air_force_officer_recruitment:0 "Подготовка офицеров ВВС"
  wuw_HUN_air_force_officer_recruitment_desc:0 "Аэроклубы, работающие при поддержке Школы офицеров резерва ВВС, обеспечат необходимую базу для лётной и боевой подготовки резервистов."
  wuw_HUN_expand_airfield_capacity:0 "Расширение инфраструктуры ВВС"
  wuw_HUN_expand_airfield_capacity_desc:0 "Министерство авиации подготовило план строительства новых аэродромов с ангарами для хранения и ремонта авиатехники, а также казармами для проживания лётного и наземного персонала."
  wuw_HUN_trust_in_old_guard:0 "Опыт старой гвардии"
  wuw_HUN_trust_in_old_guard_desc:0 "Ветераны Великой войны, заслужившие наше полное доверие, будут передавать своё лётное мастерство и опыт новому поколению пилотов."
  wuw_HUN_expand_the_aero_clubs:0 "Развитие сети аэроклубов"
  wuw_HUN_expand_the_aero_clubs_desc:0 "Мы уже убедились, что аэроклубы способны обеспечивать стабильный приток талантливых пилотов в наши ВВС. Нам следует продолжить развитие их сети."
  wuw_HUN_air_training_abroad:0 "Обучение пилотов за границей"
  wuw_HUN_air_training_abroad_desc:0 "Обучаясь в авиационных учебных заведениях стран Оси, наши курсанты смогут получить разностороннюю подготовку и ценный опыт, который пригодится им после возвращения на службу."
  wuw_HUN_establish_air_defense_zones:0 "Обозначение зон ПВО"
  wuw_HUN_establish_air_defense_zones_desc:0 "Чтобы повысить эффективность противовоздушной обороны, мы можем разместить новые зенитные батареи в стратегических точках и обозначить зоны ПВО с координацией на территориальном уровне."
  wuw_HUN_the_air_is_our_sea:0 "Небо — это наши моря"
  wuw_HUN_the_air_is_our_sea_desc:0 "Систематическое обучение лётному мастерству делает наших пилотов храбрыми и уверенными в себе. «У нас нет ни океанских портов, ни океанских судов. Небо — это наши моря»."
  wuw_HUN_second_to_none:0 "Мировой лидер"
  wuw_HUN_second_to_none_desc:0 "Наши авиастроители непрерывно совершенствуют конструкцию своих самолётов. Продолжив исследования, мы станем мировым лидером в этой отрасли!"
  wuw_HUN_diversify_airframe_production:0 "Диверсификация авиастроения"
  wuw_HUN_diversify_airframe_production_desc:0 "Для решения различных задач в воздухе одних истребителей недостаточно. Нам нужны самолёты других типов и размеров."
  HUN_axis_air_forces_dynamic_modifier:0 "ВВС стран Оси"
  HUN_axis_air_forces_dynamic_modifier_desc:0 "ВВС Венгрии интегрированы с общеосевой авиационной доктриной. Может, самолётов у нас и немного, зато пилоты всегда готовы к вылету."
  HUN_axis_air_forces_ns_intro_tt:0 "§WМодификатор§! §Y«$HUN_axis_air_forces_dynamic_modifier$»§! §Wизменится на§!:"
  wuw_HUN_establish_air_defense_zones_enable_tt:0 "Открывает доступ к §Yзонам ПВО§!"
  wuw_HUN_establish_air_defense_zones_tt:0 "Статический коэффициент вероятности попадания ПВО: §G+10%§!"
 HUN_heirs_of_the_huns_idea_updated:0 "Наследники гуннов"
 HUN_heirs_of_the_huns_idea_updated_desc:0 "Дух Аттилы живёт в наших бронетанковых дивизиях."
 HUN_turul_association_idea_updated:0 "Ассоциация «Турул»"
 HUN_turul_association_idea_updated_desc:0 "Ассоциация «Турул» объединяет национальную молодёжь вокруг ревизионистских и патриотических идеалов."
 HUN_quantity_over_quality_idea:0 "Качество, а не количество"
 HUN_quantity_over_quality_idea_desc:0 "Наши механизированные войска лучшие в мире, даже если их немного."
 HUN_legacy_of_the_black_legion_idea_updated:0 "Наследие Чёрной армии"
 HUN_legacy_of_the_black_legion_idea_updated_desc:0 "Традиции Чёрной армии живут в наших современных бронетанковых войсках."
 HUN_light_infantry_divisions_doctrine_idea_updated:0 "Доктрина лёгких пехотных дивизий"
 HUN_light_infantry_divisions_doctrine_idea_updated_desc:0 "Наша пехота обучена действовать с минимальной поддержкой, полагаясь на скорость и агрессию."
 HUN_gyor_program:0 "Дьёрская программа"
 HUN_gyor_program_desc:0 "Комплексная программа перевооружения и индустриализации для подготовки Венгрии к её законному месту среди великих держав."
 HUN_gyor_program2:0 "Расширение Дьёрской программы"
 HUN_gyor_program2_desc:0 "Дьёрская программа расширена за счёт иностранных инвестиций и технического опыта."
