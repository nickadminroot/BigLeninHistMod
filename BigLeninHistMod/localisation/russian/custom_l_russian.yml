 fleet_costs_modifier_desc:0 "Наши морские амбиции напрямую отражаются на бюджете страны, все больше предприятий будет требоваться для обработки металла, создания орудий, логистики и финансирования проектов. Чем сильнее мы хотим стать морской державой №1 в мире - тем сильнее это будет сказываться на потенциале нашей промышленности."
 allied_africa_control_modifier:0 "Контроль Африки (Союзники)"
 allied_africa_control_modifier_desc:0 "Контроль над африканскими территориями даёт промышленные бонусы. Каждая контролируемая территория сверх оси даёт +0.5% к промышленной мощности и эффективности производства."
 axis_africa_control_modifier:0 "Контроль Африки (Ось)"
 axis_africa_control_modifier_desc:0 "Контроль над африканскими территориями даёт промышленные бонусы. Каждая контролируемая территория сверх союзников даёт +0.5% к промышленной мощности и эффективности производства."
