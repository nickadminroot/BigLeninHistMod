l_russian:
 filler_national_focus:0 "Заполняющий фокус"
 fleet_costs_modifier:0 "Расходы на флот"
 fleet_costs_modifier_desc:0 "Наши морские амбиции напрямую отражаются на бюджете страны, все больше предприятий будет требоваться для обработки металла, создания орудий, логистики и финансирования проектов. Чем сильнее мы хотим стать морской державой номер 1 в мире - тем сильнее это будет сказываться на потенциале нашей промышленности."
 allied_africa_control_modifier:0 "Контроль Африки (Союзники)"
 allied_africa_control_modifier_desc:0 "Контроль над африканскими территориями даёт промышленные бонусы. Каждая контролируемая территория сверх оси даёт +0.5% к промышленной мощности и эффективности производства."
 axis_africa_control_modifier:0 "Контроль Африки (Ось)"
 axis_africa_control_modifier_desc:0 "Контроль над африканскими территориями даёт промышленные бонусы. Каждая контролируемая территория сверх союзников даёт +0.5% к промышленной мощности и эффективности производства."
 ENG_iraq_under_control:0 "Ирак под контролем"
 ENG_iraq_under_control_desc:0 "Контроль над Ираком обеспечивает доступ к дополнительным нефтяным ресурсам, увеличивая производство топлива."
 STRATEGICREGION_299:0 "Западный Египет"
 STRATEGICREGION_300:0 "Южный Египет"
 BLHM_GER_invest_in_italian_industry:0 "Инвестиции в промышленность Италии"
 BLHM_GER_invest_in_italian_industry_desc:0 "Италия промышленно слишком слаба, чтобы быть надежным союзником. Нужно как можно быстрее помочь ей перейти на военные рельсы."
 BLHM_GER_libyan_industry:0 "Ливийская промышленность"
 BLHM_GER_libyan_industry_desc:0 "Изыскание и разработка месторождений, богатых ресурсами Ливии, позволит получить дополнительные материалы для поддержки военной машины."
 BLHM_GER_spanish_african_bases:0 "Договор с Испанией об Африканских базах"
 BLHM_GER_spanish_african_bases_desc:0 "Чтобы эффективно разгружать торговые пути противников, нужна глубокая логистика. Нейтральный статус Испании играет нам на руку: союзники не смогут атаковать их базы, а Германия сможет использовать их для починки флота."
 BLHM_GER_prepare_east_african_sabotage:0 "Подготовить диверсии в Восточной Африке"
 BLHM_GER_prepare_east_african_sabotage_desc:0 "Германия подготовит нарушение путей снабжения национальных противников, чтобы быть лучше подготовленной к Африканской кампании."
 BLHM_GER_prepare_east_african_sabotage_tt:0 "Открывает решение §YПлан Скорпион§! после вступления Италии в войну."
 BLHM_GER_mediterranean_exercises:0 "Средиземноморские учения"
 BLHM_GER_mediterranean_exercises_desc:0 "Командование постановило, что для ведения войны на нескольких фронтах нужно лучше подготовить союзников к надвигающейся войне."
 BLHM_ITA_german_industrial_aid:0 "Немецкая промышленная помощь"
 BLHM_ITA_german_industrial_aid_desc:0 "Германские инвестиции и специалисты помогают Италии ускорить переход промышленности на военные рельсы."
 BLHM_GER_investments_in_libya:0 "Инвестиции в Ливию"
 BLHM_GER_investments_in_libya_desc:0 "Разработка ливийских месторождений требует временного отвлечения германских строительных и промышленных ресурсов."
 BLHM_GER_german_army_training:0 "Немецкая армейская подготовка"
 BLHM_GER_german_army_training_desc:0 "Германские инструкторы готовят армию к войне на широком средиземноморском театре."
 GER_mediterranean_operations_cat:0 "Средиземноморские операции"
 BLHM_GER_plan_scorpion:0 "План Скорпион"
 BLHM_GER_plan_scorpion_desc:0 "Мы готовы совершить диверсию на железных дорогах Союзников в Африканском регионе, чтобы временно нарушить логистические маршруты противника."
 BLHM_GER_plan_scorpion_effect_tt:0 "Подрывает все железные дороги, хабы снабжения и порты в выбранных регионах Восточной Африки."
