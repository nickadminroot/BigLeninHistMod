l_russian:
 category_infantry_light:0 "Лёгкая пехота"
 category_infantry_light_desc:0 "Пехотные подразделения низкого качества со сниженной атакой по пехоте, но улучшенной эффективностью снабжения. Включает ополчение, иррегулярные формирования и другие импровизированные отряды."
 category_infantry_standard:0 "Стандартная пехота"
 category_infantry_standard_desc:0 "Основа любой армии. Стандартная пехота обеспечивает сбалансированное сочетание огневой мощи, организации и потребления снабжения."
 category_infantry_heavy:0 "Тяжёлая пехота"
 category_infantry_heavy_desc:0 "Элитные пехотные подразделения с усиленной атакой по пехоте и повышенной организацией. Включает спецназ, моторизованную и механизированную пехоту."
 light_infantry:0 "Батальон лёгкой пехоты"
 light_infantry_desc:0 "Легко вооружённый пехотный батальон со сниженной атакой по пехоте, но меньшим потреблением снабжения и более низкими требованиями к организации. Идеально подходит для кавалерийских и мобильных соединений."
 heavy_infantry:0 "Батальон тяжёлой пехоты"
 heavy_infantry_desc:0 "Тяжело вооружённый пехотный батальон с усиленной атакой по пехоте и повышенной организацией. Более высокое потребление снабжения и время обучения отражают элитный статус этих войск."
