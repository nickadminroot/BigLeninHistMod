l_russian:
 # Focuses
 USA_limited_intervention: "Ограниченное вмешательство"
 USA_limited_intervention_desc: "Пришло время играть более активную роль в мировых делах. Нашим первым шагом станет поддержка тех, кто сопротивляется силам агрессии."
 USA_war_propaganda: "Военная пропаганда"
 USA_war_propaganda_desc: "Американский народ должен осознать угрозы, стоящие перед нашей страной и нашими ценностями. Скоординированная пропагандистская кампания подготовит их к грядущим вызовам."
 USA_focus_on_europe: "Акцент на Европе"
 USA_focus_on_europe_desc: "Ситуация в Европе требует нашего внимания. Мы должны координировать действия с союзниками, чтобы сдержать германскую агрессию и поддержать освобождение оккупированных стран."
 USA_focus_on_asia: "Экономическая блокада Японии"
 USA_focus_on_asia_desc: "Японская агрессия в Азии угрожает балансу сил в Тихом океане. Экономическая блокада подорвёт их военную машину и покажет нашу решимость."
 USA_office_of_strategic_services: "Управление стратегических служб"
 USA_office_of_strategic_services_desc: "Нам нужно централизованное разведывательное агентство для координации шпионажа и диверсионных операций в тылу врага."
 USA_magic: "Разведывательный корпус морпехов"
 USA_magic_desc: "Криптоанализ и радиоразведка жизненно важны для современной войны. Корпус морской пехоты создаст специализированное разведывательное подразделение для расшифровки вражеских сообщений."
 USA_preventive_mobilization_projects: "Проекты превентивной мобилизации"
 USA_preventive_mobilization_projects_desc: "Необходимо заранее подготовиться к возможным столкновениям с противниками. Мы не можем знать, что готовит завтрашний день."
 USA_the_giant_has_awoken: "Гигант пробудился"
 USA_the_giant_has_awoken_desc: "Американская промышленность полностью мобилизована для войны. Наши производственные возможности достигли беспрецедентного уровня."

 # Economy Laws
 USA_american_dream: "Американская мечта"
 USA_american_dream_desc: "Экономическая политика, направленная на поддержание американского уровня жизни при одновременной поддержке военных усилий за счёт ограниченной мобилизации."
 USA_giant_wakes_economy: "Гигант пробуждается"
 USA_giant_wakes_economy_desc: "По мере того как нация пробуждается к реалиям войны, наша промышленность переключается на военное производство, сохраняя при этом необходимый гражданский потенциал."
 USA_giant_has_awoken_economy: "Гигант пробудился"
 USA_giant_has_awoken_economy_desc: "Вся мощь американской промышленной машины теперь направлена на победу. Каждый завод работает круглосуточно, чтобы снабжать наши силы."

 # National Spirits
 USA_soviet_american_agreement: "Советско-американское соглашение"
 USA_soviet_american_agreement_desc: "Соглашение об экономическом сотрудничестве между Соединёнными Штатами и Советским Союзом увеличивает наш промышленный потенциал и снижает потребности в товарах народного потребления."

 # Tooltips
 BLHM_embargo_germany_tt: "§YЭмбарго против Германии§!\nСША, Великобритания, Франция, Нидерланды, Бельгия и все основные союзники введут эмбарго против Германии."
 BLHM_embargo_japan_tt: "§YЭмбарго против Японии§!\nСША, Нидерланды, Голландская Ост-Индия и все основные союзники введут эмбарго против Японии."
 BLHM_arsenal_of_democracy_tt: "§YАрсенал демократии§!\nПредоставляет экономический закон §Y«Американская мечта»§! и §G8§! военных заводов."
 BLHM_military_construction_tt: "§YВоенное строительство§!\nПредоставляет §G8§! военных заводов."
 BLHM_USACE_projects_tt: "§YПроекты Инженерного корпуса§!\nПредоставляет §G8§! военных заводов."
 BLHM_two_ocean_navy_tt: "§YЗакон о флоте двух океанов§!\nПредоставляет §G6§! верфей."

 # Events - Germany Embargo
 BLHM_USA.1.t: "США вводят экономическое эмбарго"
 BLHM_USA.1.d: "Соединённые Штаты ввели всеобъемлющее экономическое эмбарго против Германского рейха. Вся американская и союзническая торговля с Германией запрещена. Это серьёзно ограничит наш доступ к жизненно важным ресурсам и промышленным товарам."
 BLHM_USA.1.a: "Они пожалеют об этом решении."

 # News - Germany Embargo
 BLHM_USA.2.t: "США объявляют экономическую войну Германии"
 BLHM_USA.2.d: "Решительным шагом Соединённые Штаты объявили о полном экономическом эмбарго против нацистской Германии. Эмбарго, скоординированное с союзными странами, включая Великобританию, Францию, Нидерланды и Бельгию, направлено на ограничение доступа Германии к стратегическим материалам и промышленным ресурсам. Это знаменует собой значительную эскалацию участия Америки в европейском конфликте, останавливаясь в шаге от военного вмешательства, но нанося серьёзный удар по германской военной экономике."
 BLHM_USA.2.a: "Петля затягивается."

 # Events - Japan Embargo
 BLHM_USA.3.t: "США вводят эмбарго на нефть и резину"
 BLHM_USA.3.d: "Соединённые Штаты ввели разрушительное эмбарго на экспорт нефти и резины в Японию. Наша военная экспансия в Тихом океане теперь находится под прямой угрозой. Без доступа к американской нефти и сырью наша военная машина остановится в течение нескольких месяцев."
 BLHM_USA.3.a: "Они пожалеют об этом решении."

 # News - Japan Embargo
 BLHM_USA.4.t: "США вводят экономическую блокаду Японии"
 BLHM_USA.4.d: "В ответ на продолжающуюся японскую агрессию в Азии и оккупацию китайской территории Соединённые Штаты объявили о всеобъемлющей экономической блокаде Японской империи. Работая в тесном сотрудничестве с Голландской Ост-Индией, Великобританией и другими союзными странами, блокада направлена на ограничение доступа Японии к жизненно важной нефти, резине и сырью. Императорская японская военная машина, сильно зависящая от импортных ресурсов, теперь стоит перед суровым выбором: остановить экспансию или рискнуть прямым столкновением с Соединёнными Штатами."
 BLHM_USA.4.a: "Баланс сил на Тихом океане меняется."
