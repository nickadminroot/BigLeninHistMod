 # Stage 3 — Allied Integration Decisions
 USA_allied_integration_decisions: "Решения союзной интеграции"
 USA_allied_integration_decisions_desc: "Скоординированные программы по интеграции военных и экономических усилий союзников."

 # Decisions
 USA_scientist_exchange_program: "Программа обмена учёными"
 USA_scientist_exchange_program_desc: "Создать программу обмена научными знаниями и специалистами с союзными странами, ускоряющую совместные исследовательские усилия."
 USA_scientist_exchange_program_complete_tt: "§YПрограмма обмена учёными§!\nСША и все члены союзной коалиции получают §G+5%§! к скорости исследований."

 USA_sherman_firefly_program: "Программа «Шерман Файрфлай»"
 USA_sherman_firefly_program_desc: "Модернизировать парк средних танков союзников, оснастив «Шерманы» скоростными орудиями, способными пробивать броню более тяжёлых немецких танков."
 USA_sherman_firefly_program_complete_tt: "§YПрограмма «Шерман Файрфлай»§!\nСША и все члены союзной коалиции получают §G+10%§! к атаке по мягким и твёрдым целям средних танков."

 USA_unified_command_center: "Объединённый командный центр"
 USA_unified_command_center_desc: "Создать объединённый командный центр союзников для координации морских операций, десантных операций и береговой бомбардировки на всех театрах военных действий."
 USA_unified_command_center_complete_tt: "§YОбъединённый командный центр§!\nСША и все члены союзной коалиции получают:\n§G+15%§! к скорости планирования морских вторжений\n§G+5%§! к обороне десантных операций\n§G+15%§! к бонусу береговой бомбардировки"

 USA_dispersed_production_program: "Программа рассредоточенного производства"
 USA_dispersed_production_program_desc: "Внедрить методы рассредоточенного производства на предприятиях союзных стран для повышения производственной устойчивости и эффективности за счёт децентрализации заводов."
 USA_dispersed_production_program_complete_tt: "§YПрограмма рассредоточенного производства§!\nСША и все члены союзной коалиции получают:\n§G+15%§! к росту эффективности производства\n§G+20%§! к сохранению эффективности при смене линии"

 # Stage 3 Ideas
 USA_scientist_exchange_program_idea: "Программа обмена учёными"
 USA_scientist_exchange_program_idea_desc: "Постоянное научное сотрудничество с союзными странами ускоряет исследования во всех областях."
 USA_sherman_firefly_program_idea: "Программа «Шерман Файрфлай»"
 USA_sherman_firefly_program_idea_desc: "Парк средних танков союзников модернизирован скоростными орудиями для улучшенной борьбы с бронетехникой."
 USA_unified_command_center_idea: "Объединённый командный центр"
 USA_unified_command_center_idea_desc: "Объединённая командная структура союзников координирует морские операции и десантные действия на всех театрах."
 USA_dispersed_production_program_idea: "Программа рассредоточенного производства"
 USA_dispersed_production_program_idea_desc: "Методы рассредоточенного производства повышают производственную устойчивость и эффективность промышленности союзников."

