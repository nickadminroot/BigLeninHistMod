l_russian:
 # Focuses
 USA_limited_intervention: "Ограниченное вмешательство"
 USA_limited_intervention_desc: "Пришло время играть более активную роль в мировых делах. Нашим первым шагом станет поддержка тех, кто сопротивляется силам агрессии."
 USA_war_propaganda: "Военная пропаганда"
 USA_war_propaganda_desc: "Американский народ должен осознать угрозы, стоящие перед нашей страной и нашими ценностями. Скоординированная пропагандистская кампания подготовит их к грядущим вызовам."
 USA_focus_on_europe: "Акцент на Европе"
 USA_focus_on_europe_desc: "Ситуация в Европе требует нашего внимания. Мы должны координировать действия с союзниками, чтобы сдержать германскую агрессию и поддержать освобождение оккупированных стран."
 USA_focus_on_asia: "Экономическая блокада Японии"
 USA_focus_on_asia_desc: "Японская агрессия в Азии угрожает балансу сил в Тихом океане. Экономическая блокада подорвёт их военную машину и покажет нашу решимость."
 USA_office_of_strategic_services: "Управление стратегических служб"
 USA_office_of_strategic_services_desc: "Нам нужно централизованное разведывательное агентство для координации шпионажа и диверсионных операций в тылу врага."
 USA_magic: "Разведывательный корпус морпехов"
 USA_magic_desc: "Криптоанализ и радиоразведка жизненно важны для современной войны. Корпус морской пехоты создаст специализированное разведывательное подразделение для расшифровки вражеских сообщений."
 USA_preventive_mobilization_projects: "Проекты превентивной мобилизации"
 USA_preventive_mobilization_projects_desc: "Необходимо заранее подготовиться к возможным столкновениям с противниками. Мы не можем знать, что готовит завтрашний день."
 USA_the_giant_has_awoken: "Гигант пробудился"
 USA_the_giant_has_awoken_desc: "Американская промышленность полностью мобилизована для войны. Наши производственные возможности достигли беспрецедентного уровня."

 # Economy Laws
 USA_zero_export_trade_law: "Без экспорта ресурсов"
 USA_zero_export_trade_law_desc: "Пока Соединённые Штаты отрезаны от международной торговли, внутренние ресурсы остаются в стране, а не экспортируются. После восстановления торговли этот закон автоматически заменяется на «Свободную торговлю»."
 USA_american_dream: "Американская мечта"
 USA_american_dream_desc: "Экономическая политика, направленная на поддержание американского уровня жизни при одновременной поддержке военных усилий за счёт ограниченной мобилизации."
 USA_giant_wakes_economy: "Гигант пробуждается"
 USA_giant_wakes_economy_desc: "По мере того как нация пробуждается к реалиям войны, наша промышленность переключается на военное производство, сохраняя при этом необходимый гражданский потенциал."
 USA_giant_has_awoken_economy: "Гигант пробудился"
 USA_giant_has_awoken_economy_desc: "Вся мощь американской промышленной машины теперь направлена на победу. Каждый завод работает круглосуточно, чтобы снабжать наши силы."

 # National Spirits
 USA_soviet_american_agreement: "Советско-американское соглашение"
 USA_soviet_american_agreement_desc: "Соглашение об экономическом сотрудничестве между Соединёнными Штатами и Советским Союзом увеличивает наш промышленный потенциал и снижает потребности в товарах народного потребления."

 # Tooltips
 BLHM_embargo_germany_tt: "§YЭмбарго против Германии§!\nСША, Великобритания, Франция, Нидерланды, Бельгия и все основные союзники введут эмбарго против Германии."
 BLHM_embargo_japan_tt: "§YЭмбарго против Японии§!\nСША, Нидерланды, Голландская Ост-Индия и все основные союзники введут эмбарго против Японии."
 BLHM_arsenal_of_democracy_tt: "§YАрсенал демократии§!\nВводит экономический закон §Y«Американская мечта»§! и строит §G8§! военных заводов в национальных регионах США."
 BLHM_USACE_projects_tt: "§YПроекты Инженерного корпуса§!\nСтроит §G8§! военных заводов в национальных регионах США."
 BLHM_preventive_mobilization_projects_tt: "§YПроекты превентивной мобилизации§!\nСтроит §G4§! военных завода в национальных регионах США."
 BLHM_two_ocean_navy_tt: "§YЗакон о флоте двух океанов§!\nСтроит §G6§! верфей в национальных регионах США."
 USA_hemisphere_defense_tt: "§YЗащита полушария§!\nСоздаёт Панамериканскую фракцию и приглашает демократические страны Америки."

 # Events - Germany Embargo
 BLHM_USA.1.t: "США вводят экономическое эмбарго"
 BLHM_USA.1.d: "Соединённые Штаты ввели всеобъемлющее экономическое эмбарго против Германского рейха. Вся американская и союзническая торговля с Германией запрещена. Это серьёзно ограничит наш доступ к жизненно важным ресурсам и промышленным товарам."
 BLHM_USA.1.a: "Они пожалеют об этом решении."

 # News - Germany Embargo
 BLHM_USA.2.t: "США объявляют экономическую войну Германии"
 BLHM_USA.2.d: "Решительным шагом Соединённые Штаты объявили о полном экономическом эмбарго против нацистской Германии. Эмбарго, скоординированное с союзными странами, включая Великобританию, Францию, Нидерланды и Бельгию, направлено на ограничение доступа Германии к стратегическим материалам и промышленным ресурсам. Это знаменует собой значительную эскалацию участия Америки в европейском конфликте, останавливаясь в шаге от военного вмешательства, но нанося серьёзный удар по германской военной экономике."
 BLHM_USA.2.a: "Петля затягивается."

 # Events - Japan Embargo
 BLHM_USA.3.t: "США вводят эмбарго на нефть и резину"
 BLHM_USA.3.d: "Соединённые Штаты ввели разрушительное эмбарго на экспорт нефти и резины в Японию. Наша военная экспансия в Тихом океане теперь находится под прямой угрозой. Без доступа к американской нефти и сырью наша военная машина остановится в течение нескольких месяцев."
 BLHM_USA.3.a: "Они пожалеют об этом решении."

 # News - Japan Embargo
 BLHM_USA.4.t: "США вводят экономическую блокаду Японии"
 BLHM_USA.4.d: "В ответ на продолжающуюся японскую агрессию в Азии и оккупацию китайской территории Соединённые Штаты объявили о всеобъемлющей экономической блокаде Японской империи. Работая в тесном сотрудничестве с Голландской Ост-Индией, Великобританией и другими союзными странами, блокада направлена на ограничение доступа Японии к жизненно важной нефти, резине и сырью. Императорская японская военная машина, сильно зависящая от импортных ресурсов, теперь стоит перед суровым выбором: остановить экспансию или рискнуть прямым столкновением с Соединёнными Штатами."
 BLHM_USA.4.a: "Баланс сил на Тихом океане меняется."

 # Stage 2 Focuses
 USA_modernize_the_economy: "Модернизация экономики"
 USA_modernize_the_economy_desc: "Американская промышленность должна быть модернизирована, чтобы противостоять вызовам мира в состоянии войны. Новые методы производства и экономические реформы заложат основу для нашей будущей силы."
 USA_allied_war_industry: "Союзная военная промышленность"
 USA_allied_war_industry_desc: "Наши союзники в Европе и Азии сражаются за выживание. Координируя наши промышленные усилия, мы можем обеспечить их ресурсами, необходимыми для продолжения борьбы."
 USA_asia_doctrine: "Азиатская оборонительная доктрина"
 USA_asia_doctrine_desc: "Тихоокеанский театр требует комплексной оборонительной стратегии. Мы должны укрепить аэродромы в Бирме, Сингапуре и Голландской Ост-Индии для проекции воздушной мощи против японской агрессии."
 USA_europe_doctrine: "Европейская оборонительная доктрина"
 USA_europe_doctrine_desc: "Оборона Британских островов имеет первостепенное значение. Мы должны подготовить аэродромы и военно-морские базы в южной Англии для поддержки операций на Европейском театре."
 USA_globalize_air_industry: "Глобализация авиапрома"
 USA_globalize_air_industry_desc: "Производство американских самолётов должно расширяться, чтобы удовлетворить глобальный спрос. Мы инвестируем в новые конструкции и производственные технологии для сохранения превосходства в воздухе."
 USA_share_designs_with_britain: "Передать чертежи Британии"
 USA_share_designs_with_britain_desc: "Королевские ВВС срочно нуждаются в доступе к новейшим американским авиационным разработкам. Передача наших технологий усилит союзный воздушный флот."
 USA_improve_infantry_doctrines: "Улучшить пехотные доктрины"
 USA_improve_infantry_doctrines_desc: "Современная пехотная тактика требует постоянного совершенствования. Мы разработаем новые доктрины для повышения эффективности наших сухопутных сил и поделимся этими уроками с союзниками."
 USA_joint_tank_development: "Совместная разработка танков"
 USA_joint_tank_development_desc: "Сотрудничество с союзными инженерами в области танкостроения позволит создать более эффективные бронированные машины. Совместные исследования дадут нашим войскам преимущество на поле боя."
 USA_allied_military_economic_integration: "Союзная военно-экономическая интеграция"
 USA_allied_military_economic_integration_desc: "Объединив союзные структуры командования, промышленное планирование и снабжение, мы превратим совокупную военную и экономическую мощь коалиции в решающее преимущество."
 USA_domestic_production: "Внутреннее производство"
 USA_domestic_production_desc: "Расширение внутреннего промышленного потенциала имеет первостепенное значение. Мы должны наращивать строительство военных заводов для снабжения наших вооружённых сил."
 USA_mass_production: "Массовое производство"
 USA_mass_production_desc: "Методы массового производства, созданные американской промышленностью, будут применены к военному выпуску, что значительно увеличит наш производственный потенциал."
 USA_american_bonds: "Американские облигации"
 USA_american_bonds_desc: "Общенациональная кампания по продаже облигаций соберёт средства для военных нужд, одновременно снижая потребительский спрос, помогая контролировать инфляцию и стабилизировать экономику."
 USA_radar_technologies: "Радарные технологии"
 USA_radar_technologies_desc: "Инвестиции в радарные исследования обеспечат наши силы передовыми возможностями обнаружения, что крайне важно для противовоздушной обороны и морских операций."
 USA_new_machine_tools: "Новые станки"
 USA_new_machine_tools_desc: "Новейшее поколение точных станков произведёт революцию в эффективности нашего производства, устраняя расточительные производственные практики."
 USA_national_mobilization: "Национальная мобилизация"
 USA_national_mobilization_desc: "С полной мобилизацией нации для тотальной войны каждый аспект нашей экономики направлен на окончательную победу над державами Оси."

 # Stage 2 National Spirits
 USA_american_economy: "Американская экономика"
 USA_american_economy_desc: "Модернизация американской промышленности повысила эффективность производства и максимальный выход продукции."
 USA_american_economy_domestic: "Американская экономика"
 USA_american_economy_domestic_desc: "Внутренняя мобилизация ускоряет строительство военных заводов по всей стране."
 USA_american_economy_modernized: "Американская экономика"
 USA_american_economy_modernized_desc: "Передовые станки устранили неэффективность, в то время как военное строительство продолжается ускоренными темпами."
 USA_american_economy_mobilized: "Американская экономика"
 USA_american_economy_mobilized_desc: "Полностью мобилизованная американская экономика производит на беспрецедентном уровне, поднимая исследования и промышленный выпуск на новые высоты."
 USA_aid: "Американская помощь"
 USA_aid_desc: "Мы получаем жизненно важную промышленную поддержку и оборудование от Соединённых Штатов в рамках программы союзной военной промышленности."
 USA_unified_infantry_command: "Объединённое пехотное командование"
 USA_unified_infantry_command_desc: "Стандартизированные пехотные доктрины и единые командные структуры улучшают координацию и боевую эффективность союзных сил."
 USA_allied_tank_school: "Союзная танковая школа"
 USA_allied_tank_school_desc: "Совместные программы разработки танков создали превосходные конструкции бронетехники с улучшенной огневой мощью и защитой экипажа."
 USA_american_bonds_idea: "Американские облигации"
 USA_american_bonds_idea_desc: "Патриотические кампании по продаже облигаций собрали значительные средства для военных усилий, одновременно снижая потребительский спрос."

 # Stage 2 Tooltips
 BLHM_allied_war_industry_tt: "§YСоюзная военная промышленность§!\nВыдаёт дух §Y«Американская помощь»§! всем членам фракции Союзников (кроме США):\n§G+3%§! Промышленное производство\n§G+5%§! Максимальная эффективность\n§G+10%§! Строительство военных заводов"
 BLHM_asia_doctrine_tt: "§YАзиатская оборонительная доктрина§!\nПовышает уровень авиабаз до §G10§! в:\n- §YБирме§! (штаты 288, 640, 994-999)\n- §YСингапуре§! (штат 1021)\n- §YГолландской Ост-Индии§! (штаты под контролем HOL/INS)\nТребуется союзный контроль указанных штатов."
 BLHM_asia_doctrine_available_tt: "Все указанные союзные территории в Юго-Восточной Азии должны оставаться под контролем Союзников"
 BLHM_europe_doctrine_tt: "§YЕвропейская оборонительная доктрина§!\nПовышает уровень авиабаз до §G10§! и уровень военно-морских баз до §G10§! в южной Англии:\n- §YШтаты 123, 126, 127§!\n- §YПровинции 540, 11374, 3501§!\nТребуется британский контроль целевых штатов."
 BLHM_globalize_air_industry_tt: "§YГлобализация авиапрома§!\nПредоставляет §G2-летнее§! опережение по времени для исследований в категории §Y«Авиационное оборудование»§!."
 BLHM_share_designs_with_britain_tt: "§YПередать чертежи Британии§!\nВеликобритания получает §G2-летнее§! опережение для §Y«Авиационного оборудования»§! — такое же, какое США получают от фокуса §Y«Глобализация авиапрома»§!."
 BLHM_joint_tank_development_tt: "§YСовместная разработка танков§!\nПредоставляет §G+100%§! бонус к исследованиям в категории §Y«Бронетехника»§!.\nСША и союзники по коалиции получают §Y«Союзную танковую школу»§!:\n§G+5%§! Организация танков/армии\n§G+7%§! Атака брони\n§G+3%§! Атака по мягким целям"
 BLHM_allied_military_economic_integration_tt: "§YСоюзная военно-экономическая интеграция§!\nСША и все члены фракции получают дух-маркер §Y«Союзная военно-экономическая интеграция»§!.\nОткрывает категорию §Y«Решения союзной интеграции»§! — 4 поэтапных решения с постоянными бонусами для всей фракции:\n  §YПрограмма обмена учёными§! (§G35 дней§!) — §G+5%§! Скорость исследований\n  §YПрограмма «Шерман-Файрфлай»§! (§G60 дней§!) — §G+10%§! Атака средних танков\n  §YОбъединённый командный центр§! (§G60 дней§!) — §G+15%§! Планирование вторжения, §G+5%§! Защита при высадке, §G+15%§! Бомбардировка с моря\n  §YПрограмма рассредоточения§! (§G70 дней§!) — §G+15%§! Рост эффективности, §G+20%§! Сохранение при смене"
 BLHM_domestic_production_tt: "§YВнутреннее производство§!\nУлучшает закон §Y«Американская экономика»§!:\n§G+20%§! Скорость строительства военных заводов"
 BLHM_mass_production_tt: "§YМассовое производство§!\nСтроит §G4§! гражданские фабрики в национальных регионах США.\nПредоставляет §G2-летнее§! опережение по времени для исследований §Y«Станков»§!."
 BLHM_new_machine_tools_tt: "§YНовые станки§!\nУлучшает закон §Y«Американская экономика»§!:\nУстраняет штраф §R-7%§! к росту эффективности."
 BLHM_national_mobilization_tt: "§YНациональная мобилизация§!\nУлучшает закон §Y«Американская экономика»§!:\n§G+10%§! Промышленное производство\n§G+10%§! Скорость исследований\nПредоставляет два §G+75%§! бонуса к исследованиям в категории §Y«Промышленность»§!.\nТребуется война США с Японией и японский контроль Сингапура."

 # Stage 2 Events - Allied War Industry
 BLHM_USA.5.t: "Поддержка военной промышленности США"
 BLHM_USA.5.d: "Соединённые Штаты запустили масштабную программу координации промышленного производства с союзными странами. В рамках этой инициативы американский опыт, сырьё и промышленный потенциал будут переданы союзным военным производствам для максимизации совокупного выпуска Великого Альянса."
 BLHM_USA.5.a: "Мы принимаем это щедрое предложение."

 # Stage 2 Events - British Air Designs
 BLHM_USA.6.t: "Переданы чертежи американских самолётов"
 BLHM_USA.6.d: "Соединённые Штаты разрешили передачу последних спецификаций американских авиационных конструкций Королевским ВВС. Британские авиационные инженеры теперь получат доступ к американским достижениям в области конструкции самолётов, двигателестроения и методов производства, что позволит Королевским ВВС воспользоваться результатами американских авиационных исследований."
 BLHM_USA.6.a: "Отличные новости для Королевских ВВС!"

 # Stage 2 Tech bonus names
 BLHM_usa_share_designs: "Переданные американские авиационные разработки"

