 GER_east_front_failed_blitzkrieg_dm_tt:0 "§WМодификатор§! §Y«Восточный фронт»§! §Wизменится на§!:\nАтака дивизий: §R-20%§!\nЗащита дивизий: §R-20%§!\nОрганизация дивизий: §R-10%§!\nПотери от истощения: §R+10%§!\nДальность узлов снабжения: §R-15%§!\nПоддержка войны: §R-20%§!\nСтабильность: §R-15%§!"
