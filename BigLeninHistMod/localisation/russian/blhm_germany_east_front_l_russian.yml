l_russian:
 GER_east_front_win_before_winter:0 "Победить до зимы"
 GER_east_front_win_before_winter_desc:0 "Мы не должны останавливаться ни на день на пути к нашей победе. Ведь она близка как никогда!"
 GER_east_front_fortify_lines:0 "Укрепить рубежи"
 GER_east_front_fortify_lines_desc:0 "Будет опрометчиво не подготовиться к зиме. Германия не должна совершать ошибок Наполеона, а должна тщательно подойти к планированию операций и переждать зиму в тепле."
 GER_east_front_summer_campaign:0 "Летняя кампания"
 GER_east_front_summer_campaign_desc:0 "Военная машина Рейха сильна как никогда. Да, мы не смогли сломить противника в 1941 году, но этим летом удача точно будет на нашей стороне."
 GER_east_front_prepare_second_winter:0 "Подготовиться ко второй зиме"
 GER_east_front_prepare_second_winter_desc:0 "Опыт 1941 года показал, что к зиме нужно готовиться основательно, иначе Германия рискует потерять из-за холодов больше людей, чем на линии фронта."
 GER_east_front_continue_offensive:0 "Продолжать наступление"
 GER_east_front_continue_offensive_desc:0 "Мы не можем позволить противнику перегруппироваться. Это поставит на кон успех всего Блицкрига. Нужно продолжать наступление, несмотря ни на что!"
 GER_east_front_final_blow:0 "Финальный удар"
 GER_east_front_final_blow_desc:0 "Германия сконцентрировалась на Восточном фронте. Нужно совершить финальный рывок к победе."
 GER_east_front_prepare_long_war:0 "Подготовиться к затяжной войне"
 GER_east_front_prepare_long_war_desc:0 "План Барбаросса провален, но Германия не должна сдаваться. Нужно восстановить боевой дух на местах, перестроить экономику и продолжать войну."
 GER_east_front_defensive_tactics:0 "Изучить оборонительную тактику"
 GER_east_front_defensive_tactics_desc:0 "Количество атакующих операций противника растет в геометрической прогрессии. Нужно обратиться к опыту Первой мировой войны, окопаться и истощить силы противника."
 GER_east_front_supply_routes:0 "Наладить пути снабжения"
 GER_east_front_supply_routes_desc:0 "Линия фронта сильно растянута. Топливо и снаряжение практически не доходят до переднего края. Нужно наладить поставки, чтобы войска могли продолжать сражаться."
 GER_east_front_destroy_partisans:0 "Уничтожить партизанские отряды"
 GER_east_front_destroy_partisans_desc:0 "Командование постановило, что один из главных врагов, на действия которого Германия закрывала глаза, — партизаны. Пора взяться за них вплотную!"
 GER_east_front_victory_or_death:0 "Победа или смерть"
 GER_east_front_victory_or_death_desc:0 "Либо мы победим, либо Германия перестанет существовать."
 GER_east_front_blitzkrieg_triumph:0 "Триумф блицкрига"
 GER_east_front_winter_preparation:0 "Подготовка к зиме"
 GER_east_front_summer_offensive:0 "Летнее наступление"
 GER_east_front_victory_at_any_cost:0 "Победа любой ценой"
 GER_east_front_war_with_ussr:0 "Война с СССР"
 GER_east_front_failed_blitzkrieg:0 "Провалившийся блицкриг"
 GER_east_front_long_war_recovery:0 "Провалившийся блицкриг: затяжная война"
 GER_east_front_defensive_tactics_recovery:0 "Провалившийся блицкриг: оборонительная тактика"
 GER_east_front_supply_routes_recovery:0 "Провалившийся блицкриг: пути снабжения"
 GER_east_front_anti_partisan_recovery:0 "Провалившийся блицкриг: борьба с партизанами"
 GER_east_front_victory_or_death_recovery:0 "Провалившийся блицкриг: победа или смерть"
 blhm_germany_east_front.3.t:0 "Провалившийся блицкриг"
 blhm_germany_east_front.3.d:0 "Мы на всех фронтах подошли к часу, каждый шаг, каждая битва становится только труднее, враг не намерен отступать, он отдает свою жизнь за каждый метр земли. План по захвату Советского Союза сорван. Дух в войсках падает. И конец? Да поможет нам Бог!"
 blhm_germany_east_front.3.a:0 "Мы должны выстоять."
