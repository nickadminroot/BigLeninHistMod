l_russian:
 GER_fascist_pressure_minor:0 "Дипломатическое давление на потенциальных союзников"
 GER_fascist_pressure_minor_desc:0 "Волна немецкого дипломатического давления удерживает Венгрию, Болгарию и Румынию в орбите фашизма."
 GER_united_industry:0 "Объединенная промышленность"
 GER_united_industry_desc:0 "Немецкий капитал и местное производство связаны в единую промышленную систему."

 GER_diplomatic_pressure_on_potential_allies:0 "Дипломатическое давление на потенциальных союзников"
 GER_diplomatic_pressure_on_potential_allies_desc:0 "На пути к мировой гегемонии Германии потребуются верные союзники, которые будут разделять ее идеологию."
 GER_develop_hungarian_bauxite_deposits:0 "Развитие бокситовых месторождений в Венгрии"
 GER_develop_hungarian_bauxite_deposits_desc:0 "Венгрия обладает крупнейшими в мире месторождениями бокситов, которые являются ключевым ресурсом для производства алюминия. Германия предлагает профинансировать расширение этих месторождений, чтобы в будущем использовать их для своих нужд."
 GER_expand_oil_extraction_in_ploesti:0 "Расширение добычи нефти в Плоешти"
 GER_expand_oil_extraction_in_ploesti_desc:0 "Через IG Farben Германия повлияет на румынскую экономику, расширит добычу нефти и подготовит плацдарм для регулярных поставок нефтепродуктов в Рейх."
 GER_sofia_initiative:0 "Софийская инициатива"
 GER_sofia_initiative_desc:0 "Нельзя дать Болгарии дистанцироваться от Германии в надвигающемся конфликте. Нужно зафиксировать их правительство в немецкой орбите влияния."
 GER_consolidate_management_of_minor_powers:0 "Консолидировать управление ресурсами малых держав"
 GER_consolidate_management_of_minor_powers_desc:0 "Пришло время объединить промышленные мощности с союзниками, чтобы противостоять империализму Западного мира и коммунистическому влиянию на востоке."

 GER_united_industry_dec_cat:0 "Объединенная промышленность"
 GER_united_industry_dec_cat_desc:0 "Решения, расширяющие и укрепляющие промышленную интеграцию Германии и ее балканских партнеров."

 GER_united_industry_military_exercises:0 "Провести военные учения"
 GER_united_industry_military_exercises_desc:0 "Совместные учения с новым блоком закаляют армию к грядущей войне."
 GER_united_industry_radio_exchange:0 "Единая система радио-обмена войск"
 GER_united_industry_radio_exchange_desc:0 "Стандартизированная связь улучшает координацию внутри блока."
 GER_united_industry_vienna_research_center:0 "Создать единый центр исследований в Вене"
 GER_united_industry_vienna_research_center_desc:0 "Вена может стать научным центром нового промышленного устройства."
 GER_united_industry_distributed_aircraft_industry:0 "Рассредоточенная авиационная промышленность"
 GER_united_industry_distributed_aircraft_industry_desc:0 "Распределенная сеть производства снижает стоимость выпуска самолетов и усложняет ее срыв."
 GER_united_industry_military_exercises_idea:0 "Совместные военные учения"
 GER_united_industry_military_exercises_idea_desc:0 "Постоянные штабные процедуры и единые стандарты учений поддерживают армии блока в готовности."
 GER_united_industry_radio_exchange_idea:0 "Единая система радио-обмена войск"
 GER_united_industry_radio_exchange_idea_desc:0 "Стандартизированные радиопроцедуры улучшают координацию внутри блока."
 GER_united_industry_vienna_research_center_idea:0 "Венский исследовательский центр"
 GER_united_industry_vienna_research_center_idea_desc:0 "Исследовательский центр в Вене координирует знания специалистов объединенной промышленности."
 GER_united_industry_distributed_aircraft_industry_idea:0 "Рассредоточенная авиационная промышленность"
 GER_united_industry_distributed_aircraft_industry_idea_desc:0 "Распределенная сеть производства надолго снижает промышленные издержки авиации."
 GER_united_industry_civilian_industry:0 "Развитие гражданской промышленности"
 GER_united_industry_civilian_industry_desc:0 "Инвестиции расширяют гражданские промышленные мощности по всему блоку."
 GER_united_industry_military_industry:0 "Развитие военной промышленности"
 GER_united_industry_military_industry_desc:0 "Инвестиции расширяют военные промышленные мощности по всему блоку."
 GER_united_industry_protect_strategic_resources:0 "Защитить стратегические ресурсы"
 GER_united_industry_protect_strategic_resources_desc:0 "Стратегические ресурсы и ключевые порты укрепляются против саботажа и воздушных ударов."

