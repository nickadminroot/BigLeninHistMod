l_english:
 ROM_vanatori_de_munte: "Ranger Corps"
 ROM_vanatori_de_munte_desc: "Our mountain troops are being reorganized into a dedicated ranger corps, capable of operating in any terrain with superior skill and lethality."
 ROM_vanatori_de_munte_tt:0 "Unlocks §YRangers§! technology.\n§YSpecial Forces§! in forests:\nMovement: §G+10%§!\nAttack: §G+10%§!\nDefense: §G+10%§!"
 ROM_tank_production: "Tank Production"
 ROM_tank_production_desc: "Invest in domestic tank manufacturing capabilities to supply our armored forces with modern fighting vehicles."
 ROM_romanian_maneuvers: "Romanian Maneuvers"
 ROM_romanian_maneuvers_desc: "Our army's training regimen emphasizes constant maneuvers and readiness, building a core of experienced officers and men."
 ROM_forest_maneuvers: "Forest Maneuvers"
 ROM_forest_maneuvers_desc: "Special forces movement, attack, and defense in forests: +10%."
 ROM_royal_guard: "Royal Guard"
 ROM_royal_guard_desc: "Special forces attack and defense: +5%. Attrition losses: -10%."
 ROM_romanian_steel: "Romanian Steel"
 ROM_romanian_steel_desc: "Romanian metallurgy has advanced enough to produce high-quality armor plate at competitive costs, strengthening our tank industry."
 ROM_apfsds: "APFSDS"
 ROM_apfsds_desc: "Armor-piercing fin-stabilized discarding sabot rounds give our anti-tank guns the penetration power to defeat any contemporary armor."
