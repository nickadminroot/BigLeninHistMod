l_english:
 GER_fascist_pressure_minor:0 "Diplomatic Pressure on Potential Allies"
 GER_fascist_pressure_minor_desc:0 "A wave of German diplomatic pressure keeps Hungary, Bulgaria, and Romania closer to the fascist orbit."
 GER_united_industry:0 "United Industry"
 GER_united_industry_desc:0 "German capital and local production are tied together into a single industrial system."

 GER_diplomatic_pressure_on_potential_allies:0 "Diplomatic Pressure on Potential Allies"
 GER_diplomatic_pressure_on_potential_allies_desc:0 "Germany needs reliable partners on the road to continental dominance, and ideology is part of the bargain."
 GER_develop_hungarian_bauxite_deposits:0 "Develop Hungarian Bauxite Deposits"
 GER_develop_hungarian_bauxite_deposits_desc:0 "Hungary's bauxite reserves can be expanded and organized for German industrial use."
 GER_expand_oil_extraction_in_ploesti:0 "Expand Oil Extraction in Ploesti"
 GER_expand_oil_extraction_in_ploesti_desc:0 "German influence over Romanian industry can unlock a larger and steadier flow of oil toward the Reich."
 GER_sofia_initiative:0 "Sofia Initiative"
 GER_sofia_initiative_desc:0 "Bulgaria must remain firmly inside Germany's sphere of influence as the crisis deepens."
 GER_consolidate_management_of_minor_powers:0 "Consolidate Management of Minor Powers"
 GER_consolidate_management_of_minor_powers_desc:0 "Hungary, Romania, and Bulgaria are folded into a single industrial and political framework under German leadership."

 GER_united_industry_dec_cat:0 "United Industry"
 GER_united_industry_dec_cat_desc:0 "Decisions that expand and reinforce the industrial integration of Germany and its Balkan partners."

 GER_united_industry_military_exercises:0 "Conduct Military Exercises"
 GER_united_industry_military_exercises_desc:0 "Joint exercises with the new bloc sharpen the army for the coming war."
 GER_united_industry_radio_exchange:0 "Unified Troop Radio Exchange"
 GER_united_industry_radio_exchange_desc:0 "Standardized communications improve coordination across the alliance."
 GER_united_industry_vienna_research_center:0 "Create a Unified Research Center in Vienna"
 GER_united_industry_vienna_research_center_desc:0 "Vienna can become the scientific hub of the new industrial arrangement."
 GER_united_industry_distributed_aircraft_industry:0 "Distributed Aircraft Industry"
 GER_united_industry_distributed_aircraft_industry_desc:0 "A dispersed production network keeps aircraft manufacturing cheaper and harder to disrupt."
 GER_united_industry_civilian_industry:0 "Develop Civilian Industry"
 GER_united_industry_civilian_industry_desc:0 "Investment expands civilian industrial capacity across the bloc."
 GER_united_industry_military_industry:0 "Develop Military Industry"
 GER_united_industry_military_industry_desc:0 "Investment expands military industrial capacity across the bloc."
 GER_united_industry_protect_strategic_resources:0 "Protect Strategic Resources"
 GER_united_industry_protect_strategic_resources_desc:0 "Strategic resources and key ports are fortified against sabotage and air attack."

