l_english:
 GER_east_front_win_before_winter:0 "Win Before Winter"
 GER_east_front_win_before_winter_desc:0 "We must not stop for a single day on the road to victory. It is closer than ever!"
 GER_east_front_fortify_lines:0 "Fortify the Lines"
 GER_east_front_fortify_lines_desc:0 "It would be rash not to prepare for winter. Germany must not repeat Napoleon's mistakes; we must plan carefully and wait out the winter in warmth."
 GER_east_front_summer_campaign:0 "Summer Campaign"
 GER_east_front_summer_campaign_desc:0 "The Reich's war machine is stronger than ever. We failed to break the enemy in 1941, but this summer fortune will surely be on our side."
 GER_east_front_prepare_second_winter:0 "Prepare for the Second Winter"
 GER_east_front_prepare_second_winter_desc:0 "The experience of 1941 showed that winter requires thorough preparation, or Germany risks losing more men to the cold than to the frontline."
 GER_east_front_continue_offensive:0 "Continue the Offensive"
 GER_east_front_continue_offensive_desc:0 "We cannot allow the enemy to regroup. The success of the entire Blitzkrieg is at stake. The offensive must continue, no matter the cost!"
 GER_east_front_final_blow:0 "Final Blow"
 GER_east_front_final_blow_desc:0 "Germany has concentrated on the Eastern Front. We must make the final push to victory."
 GER_east_front_prepare_long_war:0 "Prepare for a Long War"
 GER_east_front_prepare_long_war_desc:0 "Operation Barbarossa has failed, but Germany must not give up. We must restore morale, rebuild the economy, and continue the war."
 GER_east_front_defensive_tactics:0 "Study Defensive Tactics"
 GER_east_front_defensive_tactics_desc:0 "Enemy offensive operations are growing exponentially. We must turn to the experience of the Great War, dig in, and exhaust the enemy."
 GER_east_front_supply_routes:0 "Improve Supply Routes"
 GER_east_front_supply_routes_desc:0 "The front line is badly overstretched. Fuel and equipment barely reach the forward edge. We must improve supply so the troops can keep fighting."
 GER_east_front_destroy_partisans:0 "Destroy Partisan Detachments"
 GER_east_front_destroy_partisans_desc:0 "The command has decided that one of the chief enemies Germany has ignored for too long is the partisans. It is time to deal with them directly!"
 GER_east_front_victory_or_death:0 "Victory or Death"
 GER_east_front_victory_or_death_desc:0 "Either we win, or Germany ceases to exist."
 GER_east_front_blitzkrieg_triumph:0 "Triumph of Blitzkrieg"
 GER_east_front_winter_preparation:0 "Winter Preparation"
 GER_east_front_summer_offensive:0 "Summer Offensive"
 GER_east_front_victory_at_any_cost:0 "Victory at Any Cost"
 GER_east_front_war_with_ussr:0 "War with the USSR"
 GER_east_front_failed_blitzkrieg:0 "Failed Blitzkrieg"
 GER_east_front_long_war_recovery:0 "Failed Blitzkrieg: Long War"
 GER_east_front_defensive_tactics_recovery:0 "Failed Blitzkrieg: Defensive Tactics"
 GER_east_front_supply_routes_recovery:0 "Failed Blitzkrieg: Supply Routes"
 GER_east_front_anti_partisan_recovery:0 "Failed Blitzkrieg: Anti-Partisan War"
 GER_east_front_victory_or_death_recovery:0 "Failed Blitzkrieg: Victory or Death"
 blhm_germany_east_front.3.t:0 "Failed Blitzkrieg"
 blhm_germany_east_front.3.d:0 "On every front we have reached the hour when every step and every battle becomes only harder. The enemy does not intend to retreat; he gives his life for every meter of land. The plan to seize the Soviet Union has been disrupted. The spirit of the troops is falling. And the end? God help us!"
 blhm_germany_east_front.3.a:0 "We must endure."
