l_english:
 filler_national_focus:0 "Filler Focus"
 fleet_costs_modifier:0 "Fleet Costs"
 fleet_costs_modifier_desc:0 "Our naval ambitions directly reflect on the budget of the country, more and more enterprises will be required to process metal, create weapons, logistics and finance projects. The stronger we want to become the #1 naval power in the world - the stronger it will affect the potential of our industry."
 allied_africa_control_modifier:0 "African Control (Allies)"
 allied_africa_control_modifier_desc:0 "Control over African territories provides industrial bonuses. Each controlled territory above the Axis adds +0.5% to industrial capacity and production efficiency."
 axis_africa_control_modifier:0 "African Control (Axis)"
 axis_africa_control_modifier_desc:0 "Control over African territories provides industrial bonuses. Each controlled territory above the Allies adds +0.5% to industrial capacity and production efficiency."
 ENG_iraq_under_control:0 "Iraq Under Control"
 ENG_iraq_under_control_desc:0 "Control of Iraq provides access to additional oil resources, increasing fuel production."
 STRATEGICREGION_299:0 "Western Egypt"
 STRATEGICREGION_300:0 "Southern Egypt"
 BLHM_GER_invest_in_italian_industry:0 "Invest in Italian Industry"
 BLHM_GER_invest_in_italian_industry_desc:0 "Italy is too industrially weak to be a reliable ally. We must help it move onto a war footing as quickly as possible."
 BLHM_GER_libyan_industry:0 "Libyan Industry"
 BLHM_GER_libyan_industry_desc:0 "Prospecting and developing Libya's resource-rich deposits will provide additional materials for the war machine."
 BLHM_GER_spanish_african_bases:0 "Treaty with Spain for African Bases"
 BLHM_GER_spanish_african_bases_desc:0 "Disrupting enemy trade routes effectively requires deep logistics. Spain's neutral status works in our favor: the Allies cannot attack their bases, while Germany can use them to repair the fleet."
 BLHM_GER_prepare_east_african_sabotage:0 "Prepare Sabotage in East Africa"
 BLHM_GER_prepare_east_african_sabotage_desc:0 "Germany will prepare disruptions against enemy supply routes to be better positioned for the African campaign."
 BLHM_GER_prepare_east_african_sabotage_tt:0 "Unlocks the §YPlan Scorpion§! decision after Italy enters the war."
 BLHM_GER_mediterranean_exercises:0 "Mediterranean Exercises"
 BLHM_GER_mediterranean_exercises_desc:0 "The command has decided that fighting on several fronts requires better preparation of our allies for the coming war."
 BLHM_ITA_german_industrial_aid:0 "German Industrial Aid"
 BLHM_ITA_german_industrial_aid_desc:0 "German investment and specialists help Italy accelerate its transition to wartime industry."
 BLHM_GER_investments_in_libya:0 "Investments in Libya"
 BLHM_GER_investments_in_libya_desc:0 "Developing Libyan deposits temporarily diverts German construction and industrial resources."
 BLHM_GER_german_army_training:0 "German Army Training"
 BLHM_GER_german_army_training_desc:0 "German instructors prepare the army for war across the wider Mediterranean theater."
 GER_mediterranean_operations_cat:0 "Mediterranean Operations"
 BLHM_GER_plan_scorpion:0 "Plan Scorpion"
 BLHM_GER_plan_scorpion_desc:0 "We are ready to sabotage Allied railways in the African region to temporarily disrupt enemy logistical routes."
 BLHM_GER_plan_scorpion_effect_tt:0 "Sabotages all railways, supply hubs, and ports in the selected East African regions."
 GER_wunderwaffe_branch_lock_flag:0 "WunderWaffe Branch Lock"
 GER_wunderwaffe_e50_unification_ready_flag:0 "E-50 Unification Ready"
 GER_wunderwaffe:0 "Start WunderWaffe Development"
 GER_wunderwaffe_desc:0 "Germany needs a decisive breakthrough. A separate research directorate is tasked with the most advanced weapons projects the Reich can fund."
 GER_wunderwaffe_me262:0 "Me-262"
 GER_wunderwaffe_me262_desc:0 "Germany will dominate the skies with a new generation of jet aircraft."
 GER_wunderwaffe_rotte:0 "Rotte"
 GER_wunderwaffe_rotte_desc:0 "A land cruiser once sounds absurd, but the command staff sees the potential in such a machine."
 GER_wunderwaffe_maus:0 "Maus"
 GER_wunderwaffe_maus_desc:0 "Germany will dominate the battlefield with a new class of super-heavy tanks."
 GER_wunderwaffe_e50:0 "E-50"
 GER_wunderwaffe_e50_desc:0 "Tank production must be unified if Germany is to maximize the number of vehicles rolling off the line each month."
 GER_wunderwaffe_e50_unification:0 "E-50 Unification"
 GER_wunderwaffe_e50_unification_desc:0 "Standardization removes duplication and restores industrial efficiency."
 GER_uranverein:0 "Uranverein"
 GER_uranverein_desc:0 "Germany must master the next generation of weapons to secure its position in the world."
 GER_amerikabomber:0 "AmerikaBomber"
 GER_amerikabomber_desc:0 "Germany needs a bomber capable of reaching any target on the globe."
 GER_wunderwaffe_development_idea:0 "WunderWaffe Development"
 GER_wunderwaffe_development_idea_desc:0 "A dedicated research directorate is concentrating the Reich's best minds on the most advanced weapons projects."
 GER_wunderwaffe_investments_idea:0 "WunderWaffe Investments"
 GER_wunderwaffe_investments_idea_desc:0 "Diverting resources into experimental weapons slows industry, raises consumer pressure, and hardens wartime resolve."
 BLHM_GER_wunderwaffe_program:0 "Wunderwaffe"
 BLHM_GER_wunderwaffe_program_desc:0 "The tank and rocket programs are ready to feed a dedicated wonder weapons branch."
 BLHM_GER_last_effort_cat:0 "Last Effort"
 BLHM_GER_mobilize_volkssturm:0 "Mobilize Volkssturm Divisions"
 BLHM_GER_mobilize_volkssturm_desc:0 "Call up emergency Volkssturm formations. Every mobilization deepens the strain on national stability."
 BLHM_GER_last_effort_modifier:0 "Last Effort"
 BLHM_GER_last_effort_modifier_desc:0 "Emergency mobilization keeps more men in the field, but the country pays for it week after week."
 BLHM_GER_high_naval_expenses_modifier:0 "High Naval Expenses"
 BLHM_GER_high_naval_expenses_modifier_desc:0 "Rapid naval expansion diverts material, factories, and construction capacity away from the wider war economy."
 GER_noveyshie_tankovye_razrabotki_idea:0 "Latest Tank Developments"
 GER_noveyshie_tankovye_razrabotki_idea_desc:0 "The new tank standard improves future output, but it makes modern chassis significantly more expensive to produce."
 GER_heavy_water_supplies_stable:0 "Heavy Water Supplies Stable"
 GER_heavy_water_supplies_stable_desc:0 "Reliable access to heavy water keeps the nuclear program moving."
 GER_heavy_water_supplies_shortage:0 "Heavy Water Shortage"
 GER_heavy_water_supplies_shortage_desc:0 "Heavy water deliveries have broken down, sharply slowing the nuclear program."
 BLHM_GER_develop_portuguese_mining:0 "Develop Portuguese Mining"
 BLHM_GER_develop_portuguese_mining_desc:0 "Our war machine demands ever greater quantities of resources, and the current output of our partners is not enough. The high command has proposed expanding the deposits in Portugal to secure more tungsten for our tanks."
 BLHM_GER_develop_portuguese_mining_tt:0 "Portugal receives all excavation technologies.\nGermany receives §YInvestments in Focus§! for §Y60 days§!: §YConsumer Goods Factories§!: §Y+10.0%§!."
 BLHM_GER_portuguese_mining_investments:0 "Investments in Focus"
 BLHM_GER_portuguese_mining_investments_desc:0 "Expanding Portuguese extraction temporarily diverts civilian industry."
 BLHM_GER_ss_police_unlocked_tt:0 "Unlocks the §YSS Police§! support company. Its resistance suppression is 1.5 times stronger than regular military police."
 BLHM_GER_ss_police_tech:0 "SS Police"
 BLHM_GER_ss_police_tech_desc:0 "Specialized SS police units for suppressing resistance in occupied territories."
 ss_police:0 "SS Police"
 ss_police_desc:0 "A specialized SS support company for suppressing resistance in occupied territories."
