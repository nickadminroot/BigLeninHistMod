  wuw_HUN_air_force_officer_recruitment:0 "Air Force Officer Recruitment"
  wuw_HUN_air_force_officer_recruitment_desc:0 "Aero clubs across the states, in collaboration with the Air Force Reserve Officers' School, meet the critical need for reserve officers by offering flying courses and live-fire exercises."
  wuw_HUN_expand_airfield_capacity:0 "Expand Airfield Capacity"
  wuw_HUN_expand_airfield_capacity_desc:0 "The Air Ministry has planned for new aerodromes and hangars to properly operate, store, and repair our aircraft, as well as dormitories for our recently established squadrons and ground crew."
  wuw_HUN_trust_in_old_guard:0 "Trust in the Old Guard"
  wuw_HUN_trust_in_old_guard_desc:0 "Veterans of the Great War who have earned our full trust will pass on their flying skills and experience to a new generation of pilots."
  wuw_HUN_expand_the_aero_clubs:0 "Expand the Aero Clubs"
  wuw_HUN_expand_the_aero_clubs_desc:0 "Aero clubs have proven their usefulness in providing a steady stream of talented pilots for Hungary; we should further expand them."
  wuw_HUN_air_training_abroad:0 "Air Training Abroad"
  wuw_HUN_air_training_abroad_desc:0 "By sending trainees to the air branches of allied Axis nations, we gain valuable insights from diverse perspectives and first-hand experience when they return to serve."
  wuw_HUN_establish_air_defense_zones:0 "Establish Air Defense Zones"
  wuw_HUN_establish_air_defense_zones_desc:0 "We could allocate our new anti-aircraft batteries at key points and factories, and establish Air Defense Zones through communication nodes at the territorial level to optimize our anti-air accuracy."
  wuw_HUN_the_air_is_our_sea:0 "The Sky is Our Seas"
  wuw_HUN_the_air_is_our_sea_desc:0 "Underneath systematic pilot training, empower our pilots to fly bravely and confidently. 'We have neither ocean ports nor ocean-going ships. The air is our sea.'"
  wuw_HUN_second_to_none:0 "Second To None"
  wuw_HUN_second_to_none_desc:0 "Our aircraft industries' plane designs are improving by the day. With further research, our designs will be second to none in the world!"
  wuw_HUN_diversify_airframe_production:0 "Diversify Airframe Production"
  wuw_HUN_diversify_airframe_production_desc:0 "We cannot just rely on our fighters to get things done in the air. Other aircraft and larger airframes are needed to fulfill other mission types."
  HUN_axis_air_forces_dynamic_modifier:0 "Axis Air Forces"
  HUN_axis_air_forces_dynamic_modifier_desc:0 "Hungary's air force is integrated with the wider Axis air doctrine. The planes might not always be ready, but our pilots always are."
  HUN_axis_air_forces_ns_intro_tt:0 "§WModify§! §Y$HUN_axis_air_forces_dynamic_modifier$§! §Wby:§!"
  wuw_HUN_establish_air_defense_zones_enable_tt:0 "Enables §YAir Defense Zones§!"
  wuw_HUN_establish_air_defense_zones_tt:0 "Static Anti Air hit chance factor: §G+10%§!"
 HUN_heirs_of_the_huns_idea_updated:0 "Heirs of the Huns"
 HUN_heirs_of_the_huns_idea_updated_desc:0 "The spirit of Attila lives on in our armored divisions."
 HUN_turul_association_idea_updated:0 "Turul Association"
 HUN_turul_association_idea_updated_desc:0 "The Turul Association rallies national youth around revisionist and patriotic ideals."
 HUN_quantity_over_quality_idea:0 "Quality, Not Quantity"
 HUN_quantity_over_quality_idea_desc:0 "Our mechanized forces are the best in the world, even if few in number."
 HUN_legacy_of_the_black_legion_idea_updated:0 "Legacy of the Black Legion"
 HUN_legacy_of_the_black_legion_idea_updated_desc:0 "The traditions of the Black Army live on in our modern armored corps."
 HUN_light_infantry_divisions_doctrine_idea_updated:0 "Light Infantry Division Doctrine"
 HUN_light_infantry_divisions_doctrine_idea_updated_desc:0 "Our infantry are trained to operate with minimal support, relying on speed and aggression."
 HUN_gyor_program:0 "Győr Program"
 HUN_gyor_program_desc:0 "A comprehensive rearmament and industrialization program to prepare Hungary for its rightful place among the great powers."
 HUN_gyor_program2:0 "Győr Program Expansion"
 HUN_gyor_program2_desc:0 "The Győr Program has been expanded with foreign investment and technical expertise."
 CZE_secular_education:0 "Secular Education"
 CZE_secular_education_desc:0 "The influence of the church in educational matters has been reduced, allowing for a more modern and scientifically-oriented curriculum."
 BLHM_ENG_mediterranean_bastion:0 "Mediterranean Bastion"
 BLHM_ENG_mediterranean_bastion_desc:0 "The Mediterranean is the heart of the British Empire's global network. Bunkers, coastal fortifications, and naval bases have been reinforced to secure the sea routes to Suez, India, and the dominions."
