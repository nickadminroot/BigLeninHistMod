l_english:
 STATE_1083:0 "Western Azerbaijan"
 BLHM_ENG_civilian_construction:0 "Civilian Construction"
 BLHM_ENG_civilian_construction_desc:0 "It is important to expand the industrial capacity of the country for the benefit of the inhabitants of our state."
 BLHM_ENG_strengthen_ties_with_france:0 "Strengthen Ties with France"
 BLHM_ENG_strengthen_ties_with_france_desc:0 "Perhaps once we had disagreements with France, but now we must stand together against the rising threats. A joint economic programme will benefit both nations."
 BLHM_ENG_strengthen_ties_france_tt:0 "Building in French North African states requires France to exist and control those territories."
 BLHM_ENG_french_bases_in_commonwealth:0 "French Bases in Australia and India"
 BLHM_ENG_french_bases_in_commonwealth_desc:0 "Tensions remain in the Asian region. We must join forces with our colleagues from France to become a united front against the growing threat from Japan."
 BLHM_ENG_aid_china:0 "Aid China"
 BLHM_ENG_aid_china_desc:0 "China may become a restraining factor. Let us help them in their war with Japan."
 BLHM_ENG_british_specialists_in_china:0 "British Specialists in China"
 BLHM_ENG_british_specialists_in_china_desc:0 "We need to study combat operations in China in more detail in order to improve the doctrines of warfare that have not changed since the Great War."
 BLHM_ENG_african_railway_project:0 "African Railway Project"
 BLHM_ENG_african_railway_project_desc:0 "Africa is a chest of gold waiting to be taken. But the chest needs to be carried somehow. A joint railway project with France will strengthen our trade in this region."
 BLHM_ENG_african_railway_tt:0 "A level-3 railway route from Casablanca to Cape Town is planned along the allied-controlled Atlantic coast. The full continuous connection depends on allied control of intervening states."
 BLHM_ENG_joint_radar_development:0 "Joint Radar Development"
 BLHM_ENG_joint_radar_bonus:0 "Joint Radar Development Bonus"
 BLHM_ENG_joint_radar_development_desc:0 "Advanced technologies related to electromagnetic waves will allow us to learn about the enemy's approach as soon as they take to the air."
 BLHM_ENG_joint_radar_development_event_tt:0 "§YFrance§! receives a §G100%§! research bonus for one radar technology."
 BLHM_ENG_national_prosperity_treaty:0 "National Prosperity Treaty"
 BLHM_ENG_national_prosperity_treaty_desc:0 "A historic joint treaty with France strengthens our economic foundations — reducing consumer goods demand, accelerating factory construction, and improving national stability."
 BLHM_ENG_joint_tank_development:0 "Joint Tank Development"
 BLHM_ENG_joint_tank_development_desc:0 "The opportunity to adopt the experience of colleagues from Paris is a gift of fate, because their Somua S35 and Char B1 are considered among the best tanks in the world."
 BLHM_ENG_joint_tank_development_tt:0 "§YJoint Tank Development§! completed. +7% Hard Attack and +5% Soft Attack will be integrated when the §YNew Tanks§! spirit exists."
 BLHM_ENG_syrian_alexandrian_corps:0 "Syrian-Alexandrian Corps"
 BLHM_ENG_syrian_alexandrian_corps_desc:0 "We conduct exercises in extreme Allied conditions to better defend our territories. Joint desert training improves infantry defence and mobility across all terrains."
 BLHM_ENG_task.1.t:0 "Joint Radar Research Programme"
 BLHM_ENG_task.1.d:0 "Our British allies have completed a joint radar development programme. Their scientists are sharing the breakthrough with us, granting a significant research advantage in radar technology."
 BLHM_ENG_task.1.a:0 "Excellent! Our radar technology will leap forward!"
 BLHM_CHI_british_advisers:0 "British Advisers"
 BLHM_CHI_british_advisers_desc:0 "British military advisers are training our troops, improving infantry combat effectiveness and entrenchment capabilities."
 BLHM_ENG_china_doctrine_observers:0 "China Doctrine Observers"
 BLHM_ENG_china_doctrine_observers_desc:0 "Our observers in China are gathering valuable combat data to improve our army doctrine development."
 BLHM_ENG_develop_trade_with_usa:0 "Develop Trade with the USA"
 BLHM_ENG_develop_trade_with_usa_desc:0 "We use diplomatic channels with the United States to compensate for the economic downturn caused by the Great War."
 BLHM_ENG_trade_with_usa_bonus:0 "Trade with USA — Industrial Research"
 BLHM_ENG_civilian_industrial_machinery:0 "Civilian Industrial Machinery"
 BLHM_ENG_civilian_industrial_machinery_desc:0 "We use diplomatic channels with the United States to compensate for the economic downturn caused by the Great War."
 BLHM_ENG_civilian_machinery_bonus:0 "Civilian Machinery — Industrial Research"
 BLHM_ENG_military_industrial_machinery:0 "Military Industrial Machinery"
 BLHM_ENG_military_industrial_machinery_desc:0 "We use diplomatic channels with the United States to compensate for the economic downturn caused by the Great War."
 BLHM_ENG_oceania_treaty:0 "Oceania Treaty"
 BLHM_ENG_oceania_treaty_desc:0 "A joint initiative with the United States to develop the civilian sector in Oceania will strengthen our Empire."
 BLHM_ENG_joint_air_industry:0 "Joint Air Industry Development"
 BLHM_ENG_joint_air_industry_desc:0 "The United States has sent a group of scientists to our country to develop the latest types of fighters."
 BLHM_ENG_joint_air_industry_bonus:0 "Joint Air Industry — Aircraft Research"
 BLHM_ENG_joint_resource_extraction:0 "Joint Resource Extraction System"
 BLHM_ENG_joint_resource_extraction_desc:0 "The combined economic might of the world's two leading powers will allow us to maintain a leading position in the resource market and fully supply the domestic market."
 BLHM_ENG_britain_prospers:0 "Britain Prospers"
 BLHM_ENG_britain_prospers_desc:0 "We enter a new globalist era by strengthening ties with key allies, and our economy is ready for any upheavals!"
 BLHM_USA_trade_with_britain:0 "Trade with Britain"
 BLHM_USA_trade_with_britain_desc:0 "British trade has boosted our economy."
 BLHM_ENG_us_civilian_machinery:0 "US Civilian Machinery"
 BLHM_ENG_us_civilian_machinery_desc:0 "American blueprints have accelerated our civilian factory construction."
 BLHM_ENG_us_military_machinery:0 "US Military Machinery"
 BLHM_ENG_us_military_machinery_desc:0 "American industrial methods have boosted our military production capacity."
 BLHM_ENG_joint_oceania_development:0 "Joint Oceania Development"
 BLHM_ENG_joint_oceania_development_desc:0 "Joint civil projects in Oceania require temporary economic adjustment."

 BLHM_ENG_soviet_economic_compromise:0 "Soviet Economic Compromise"
 BLHM_ENG_soviet_economic_compromise_desc:0 "We do not like communists, but we dislike poverty even less."
 BLHM_ENG_soviet_economic_compromise_event_tt:0 "The §YSoviet Union§! will decide whether to accept the proposal.\n§GAcceptance:§! Britain gains §Y2 Civilian Factories§! in its capital and resource rights to oil in Western Azerbaijan; the Soviet Union gains resource rights to Indian tungsten; follow-up cooperation focuses become available.\n§RRefusal:§! blocks the follow-up Soviet cooperation focuses."

 BLHM_ENG_soviet_heavy_weapons_experience:0 "Soviet Heavy Weapons Experience"
 BLHM_ENG_soviet_heavy_weapons_experience_desc:0 "The USSR has some of the finest ordnance in the world today. Let us send a research group to study their artillery development."
 BLHM_ENG_soviet_heavy_weapons_experience_bonus:0 "Soviet Heavy Weapons Experience — Artillery Research"
 BLHM_ENG_soviet_compromise_accepted_required_tt:0 "§RThe Soviet Union must accept the Soviet Economic Compromise.§!"

 BLHM_ENG_simplify_production_lines:0 "Simplify Production Lines"
 BLHM_ENG_simplify_production_lines_desc:0 "Simplified Soviet designs have reached us. Applying their mass-production experience will reduce the cost of our own small arms."

 BLHM_ENG_sloped_armor:0 "Sloped Armor"
 BLHM_ENG_sloped_armor_desc:0 "The Soviet Union was one of the first to effectively use sloped armour on its tanks. Such armour withstands far more hits than our current designs."

 BLHM_ENG_soviet_lend_lease:0 "Soviet Lend-Lease"
 BLHM_ENG_soviet_lend_lease_desc:0 "We must aid the Soviet Union in its struggle against Germany on the continent."
 BLHM_ENG_soviet_lend_lease_mission:0 "Soviet Lend-Lease Mission"
 BLHM_ENG_soviet_lend_lease_mission_desc:0 "Every 30 days, while the Soviet Union is at war with Germany, Britain sends: 10,000 Infantry Equipment; 1,000 Support Equipment; 500 Fighters; 500 Motorized Equipment; 500 Anti-Tank Equipment; 500 Anti-Air Equipment."
 BLHM_ENG_soviet_lend_lease_unlock_tt:0 "Unlocks the §Y$BLHM_ENG_soviet_lend_lease$§! decision category and starts a recurring mission.\n$BLHM_ENG_soviet_lend_lease_mission_desc$\nDeliveries pause when the Soviet Union is no longer at war with Germany and restart automatically if the war resumes."

 BLHM_ENG_quantity_over_quality:0 "Quantity over Quality"
 BLHM_ENG_quantity_over_quality_desc:0 "Simplified production methods reduce the cost of infantry equipment at the expense of individual quality."

 BLHM_ENG_soviet_lend_lease_spirit:0 "Soviet Lend-Lease Spirit"
 BLHM_ENG_soviet_lend_lease_spirit_desc:0 "Our industrial capacity is partially diverted to produce supplies for the Soviet war effort."

 BLHM_ENG_task.2.t:0 "Soviet Economic Compromise"
 BLHM_ENG_task.2.d:0 "The British propose an economic compromise: they will build factories and share Indian tungsten with us in exchange for access to our oil fields in Western Azerbaijan."
 BLHM_ENG_task.2.a:0 "Accept the compromise. Our oil for their industry."
 BLHM_ENG_task.2.accept_tt:0 "§YUnited Kingdom§!: gains §Y2 building slots§! and §Y2 civilian factories§! in Greater London, and receives oil rights in Western Azerbaijan.\n§YSoviet Union§!: receives tungsten rights in Madras, West Bengal, and Andhra Pradesh."
 BLHM_ENG_task.2.b:0 "Refuse. We do not need British charity."

 BLHM_ENG_fleet_of_britain:0 "Fleet of Britain"
 BLHM_ENG_fleet_of_britain_desc:0 "The Royal Navy is a mighty force, but maintaining global supremacy strains our industrial base and shipbuilding capacity."
 BLHM_ENG_fleet_of_britain_tt:0 "Fleet of Britain effects: −5% heavy gun attack (equipment), −10% light gun attack (equipment), +10% naval range, −10% naval organisation, +25% refit cost, +10% consumer goods demand, and +15% light and heavy hull production cost."
 BLHM_ENG_fleet_of_britain_dynamic_modifier:0 "Fleet of Britain"
 BLHM_ENG_fleet_of_britain_dynamic_modifier_desc:0 "The evolving state of the Royal Navy, its doctrine, procurement, and industrial burden."
 BLHM_ENG_modify_fleet_of_britain_dynamic_modifier_tt:0 "Modify §Y$BLHM_ENG_fleet_of_britain_dynamic_modifier$§! by:"
 BLHM_ENG_fleet_of_britain_equipment_tt:0 "§YHeavy Ship Hull§!:\n $production_cost_tt$: §Y[?ROOT.BLHM_ENG_fleet_of_britain_equipment_heavy_hull_cost|%1]§!\n§YHeavy Ship and Cruiser Hulls§!:\n $STAT_NAVY_HG_ATTACK$§Y[?ROOT.BLHM_ENG_fleet_of_britain_equipment_heavy_gun_attack|%1]§!\n§YLight Ship Hull§!:\n $production_cost_tt$: §Y[?ROOT.BLHM_ENG_fleet_of_britain_equipment_light_hull_cost|%1]§!\n§YLight Ship and Cruiser Hulls§!:\n $STAT_NAVY_LG_ATTACK$§Y[?ROOT.BLHM_ENG_fleet_of_britain_equipment_light_gun_attack|%1]§!\n§YCarrier Hull§!:\n $production_cost_tt$: §Y[?ROOT.BLHM_ENG_fleet_of_britain_equipment_carrier_hull_cost|%1]§!"
 BLHM_ENG_refit_ic_cost_tt:0 " $MODIFIER_INDUSTRIAL_REFIT_IC_COST_FACTOR$: $RIGHT|-=%1$"
 BLHM_ENG_fleet_of_britain_dynamic_modifier_navy_max_range_factor_tt:0 " $MODIFIER_NAVY_MAX_RANGE_FACTOR$: $RIGHT|+=%1$"
 BLHM_ENG_fleet_of_britain_dynamic_modifier_navy_org_factor_tt:0 " $MODIFIER_NAVY_ORG_FACTOR$: $RIGHT|-=%1$"
 BLHM_ENG_next_generation_fleet_idea:0 "Next-Generation Light Hulls"
 BLHM_ENG_next_generation_fleet_idea_desc:0 "Advanced construction techniques reduce the cost of light ship hulls."
 BLHM_ENG_faithful_to_tradition_idea:0 "Faithful to Tradition"
 BLHM_ENG_faithful_to_tradition_idea_desc:0 "Our commitment to heavy capital ships remains unwavering. Heavy and capital ship attack improved, and super-heavy battleship research accelerated."
 BLHM_ENG_anti_submarine_defence_idea:0 "Anti-Submarine Defence Network"
 BLHM_ENG_anti_submarine_defence_idea_desc:0 "A coordinated network of detection assets improves our ability to locate enemy submarines."
 BLHM_ENG_carrier_groups_idea:0 "Carrier Group Doctrine"
 BLHM_ENG_carrier_groups_idea_desc:0 "Carrier-centred battle groups are the future. Carrier hull construction is now significantly cheaper."
 BLHM_ENG_cost_optimisation_idea:0 "Naval Cost Optimisation"
 BLHM_ENG_cost_optimisation_idea_desc:0 "Streamlined dockyard operations reduce consumer goods demand and accelerate construction, at the cost of reduced heavy and light gun attack capability."
 BLHM_ENG_young_school_idea:0 "Young School Doctrine"
 BLHM_ENG_young_school_idea_desc:0 "Light forces doctrine: light gun attack significantly improved, and light hull construction costs reduced."
 BLHM_ENG_old_guard_idea:0 "Old Guard Doctrine"
 BLHM_ENG_old_guard_idea_desc:0 "Heavy forces doctrine: heavy gun attack significantly improved, and heavy hull construction costs reduced."
 BLHM_ENG_london_mk2_torpedoes_idea:0 "London Mk2 Torpedoes"
 BLHM_ENG_london_mk2_torpedoes_idea_desc:0 "Next-generation torpedoes with improved torpedo attack, screen penetration, and naval strike aircraft attack."
 BLHM_ENG_emergency_fleet_refit_idea:0 "Emergency Fleet Refit Programme"
 BLHM_ENG_emergency_fleet_refit_idea_desc:0 "A dedicated refit programme dramatically reduces the cost of modernising existing warships."

 BLHM_ENG_naval_complex_bonus:0 "Naval Complex — Destroyer Research"
 BLHM_ENG_naval_modules_bonus:0 "Next-Generation Fleet — Naval Modules"
 BLHM_ENG_asw_bonus:0 "Anti-Submarine Defence — ASW Research"
 BLHM_ENG_carrier_bonus:0 "Carrier Groups — Carrier Research"
 BLHM_ENG_ss_ahead_bonus:0 "Submarine Warfare — Submarine Ahead-of-Time"

 BLHM_ENG_task.4.t:0 "Armed Forces Priority Lock Expired"
 BLHM_ENG_task.4.d:0 "The exclusive priority period for the chosen armed forces branch has ended. Other branches may now be pursued."
 BLHM_ENG_task.4.a:0 "Understood."

 BLHM_ENG_d_day_preparations_cat:0 "D-Day Preparations"
 BLHM_ENG_prepare_recon_aircraft:0 "Prepare Reconnaissance Aircraft"
 BLHM_ENG_prepare_recon_aircraft_desc:0 "Prepare reconnaissance aircraft for the coming invasion. Uses 3 civilian factories for 56 days and costs 50 political power. Upon completion, 50 scout planes are added to stockpile — these must be deployed manually as 5 × 10-plane wings."
 BLHM_ENG_prepare_recon_aircraft_tt:0 "§Y50 scout planes§! added to stockpile. Deploy manually as 5 air wings of 10 planes each.§!"

 BLHM_ENG_war_construction:0 "War Construction"
 BLHM_ENG_war_construction_desc:0 "Expanding military potential is a necessary measure for a world superpower."
 BLHM_ENG_naval_complex:0 "Naval Complex"
 BLHM_ENG_naval_complex_desc:0 "Establish a dedicated naval industrial complex to coordinate the development of our surface fleet."
 BLHM_ENG_next_generation_fleet:0 "Next-Generation Fleet"
 BLHM_ENG_next_generation_fleet_desc:0 "Modernise our naval designs with cutting-edge modules and begin construction of a lighter, more versatile surface fleet."
 BLHM_ENG_faithful_to_tradition:0 "Faithful to Tradition"
 BLHM_ENG_faithful_to_tradition_desc:0 "Honour the legacy of the Royal Navy by investing in heavy capital ships and super-heavy battleship technology."
 BLHM_ENG_anti_submarine_defence:0 "Anti-Submarine Defence"
 BLHM_ENG_anti_submarine_defence_desc:0 "The U-boat threat must be countered. Invest in detection technology and dedicated ASW platforms."
 BLHM_ENG_carrier_groups:0 "Carrier Groups"
 BLHM_ENG_carrier_groups_desc:0 "Air power at sea is the future. Develop carrier aviation and reduce the cost of carrier hull production."
 BLHM_ENG_cost_optimisation:0 "Cost Optimisation"
 BLHM_ENG_cost_optimisation_desc:0 "Streamline naval procurement and dockyard operations. Accept reduced combat performance for greater industrial efficiency."
 BLHM_ENG_cost_optimisation_guns:0 "Naval Cost Optimisation — Gun Attack"
 BLHM_ENG_submarine_warfare:0 "Submarine Warfare"
 BLHM_ENG_submarine_warfare_desc:0 "Beneath the waves lies our asymmetric advantage. Accelerate submarine technology development."
 BLHM_ENG_young_school:0 "Young School"
 BLHM_ENG_young_school_desc:0 "A new generation of naval officers advocates for fast, light surface forces. Embrace speed and modern light-ship tactics."
 BLHM_ENG_old_guard:0 "Old Guard"
 BLHM_ENG_old_guard_desc:0 "The battle-proven admirals argue that big guns and heavy armour remain the backbone of sea power. Hold the line."
 BLHM_ENG_london_mk2_torpedoes:0 "London Mk2 Torpedoes"
 BLHM_ENG_london_mk2_torpedoes_desc:0 "Invest in the next-generation torpedo programme. Better torpedo performance will give our ships and naval aviation a decisive edge."
 BLHM_ENG_emergency_fleet_refit:0 "Emergency Fleet Refit"
 BLHM_ENG_emergency_fleet_refit_desc:0 "Establish an emergency refit programme to modernise our existing hulls at a fraction of the cost of new construction."
 BLHM_ENG_expand_british_dockyards:0 "Expand British Dockyards"
 BLHM_ENG_expand_british_dockyards_desc:0 "Our dockyards are stretched thin. Build new capacity in key coastal states to support the expanding fleet."
 BLHM_ENG_prepare_for_d_day:0 "Prepare for D-Day"
 BLHM_ENG_prepare_for_d_day_desc:0 "The liberation of Europe requires unprecedented naval preparation. Unlock special decisions to organise the invasion."

 BLHM_ENG_air_industry:0 "Air Industry"
 BLHM_ENG_air_industry_desc:0 "Establish a dedicated aviation industrial complex to coordinate the development of our air forces."
 BLHM_ENG_light_air_development:0 "Light Aircraft Development"
 BLHM_ENG_light_air_development_desc:0 "Focus on developing light fighters and close air support to maintain air superiority over the battlefield."
 BLHM_ENG_medium_air_development:0 "Medium Aircraft Development"
 BLHM_ENG_medium_air_development_desc:0 "Invest in medium bombers and multirole aircraft for strategic flexibility and reach."
 BLHM_ENG_heavy_air_development:0 "Heavy Aircraft Development"
 BLHM_ENG_heavy_air_development_desc:0 "Develop strategic bombers and heavy transport aircraft to project power far beyond our shores."
 BLHM_ENG_carrier_air_development:0 "Carrier Aircraft Development"
 BLHM_ENG_carrier_air_development_desc:0 "Naval aviation is the future of fleet combat. Develop specialised carrier-capable aircraft."
 BLHM_ENG_air_production_modernisation:0 "Air Production Modernisation"
 BLHM_ENG_air_production_modernisation_desc:0 "Modernise our aircraft production lines to reduce manufacturing costs and increase output."
 BLHM_ENG_pilot_training_programme:0 "Pilot Training Programme"
 BLHM_ENG_pilot_training_programme_desc:0 "Establish a comprehensive pilot training programme to improve pilot quality and effectiveness."
 BLHM_ENG_next_generation_ground_attack:0 "Next-Generation Ground Attack"
 BLHM_ENG_next_generation_ground_attack_desc:0 "Develop advanced ground attack aircraft and tactics to provide unparalleled close air support."
 BLHM_ENG_aircraft_machine_tools:0 "Aircraft Machine Tools"
 BLHM_ENG_aircraft_machine_tools_desc:0 "Invest in specialised machine tools for precision aircraft manufacturing."
 BLHM_ENG_aircraft_machine_tools_bonus:0 "Aircraft Machine Tools — Industrial Research"
 BLHM_ENG_new_industrial_schemes:0 "New Industrial Schemes"
 BLHM_ENG_new_industrial_schemes_desc:0 "Implement innovative industrial schemes to improve Supermarine and Spitfire production capabilities."
 BLHM_ENG_new_industrial_schemes_event_tt:0 "An event allows us to choose one permanent national spirit:\n§Y$BLHM_ENG_mio_fallback_production$§!: §G−10%§! small airframe production cost.\n§Y$BLHM_ENG_mio_fallback_defence$§!: §G+10%§! air defence."
 BLHM_ENG_raf_exercises:0 "RAF Exercises"
 BLHM_ENG_raf_exercises_desc:0 "Conduct intensive RAF exercises to improve pilot training and ace effectiveness."
 BLHM_ENG_defence_of_britain:0 "Defence of Britain"
 BLHM_ENG_defence_of_britain_desc:0 "The defence of our homeland requires supreme effort. Bolster our fighter defences and optimise production."
 BLHM_ENG_heavy_bombs_and_modified_mounts:0 "Heavy Bombs and Modified Mounts"
 BLHM_ENG_heavy_bombs_and_modified_mounts_desc:0 "Develop heavy bombs and modified aircraft mounts for devastating ground attacks."
 BLHM_ENG_heavy_bombs_bonus:0 "Heavy Bombs — Medium Aircraft Research"
 BLHM_ENG_heavy_bombs_sp_tt:0 "§YHeavy Bombs§! Unlocks the §HBouncing Bomb§! special project."
 BLHM_ENG_gloster_meteor:0 "Gloster Meteor"
 BLHM_ENG_gloster_meteor_desc:0 "Develop Britain's first operational jet fighter — the Gloster Meteor — with revolutionary axial jet engine technology."

 BLHM_ENG_medium_air_idea:0 "Medium Aircraft Programme"
 BLHM_ENG_medium_air_idea_desc:0 "Our medium bomber fleet receives improved command and control, increasing mission effectiveness."
 BLHM_ENG_heavy_air_idea:0 "Heavy Aircraft Programme"
 BLHM_ENG_heavy_air_idea_desc:0 "Strategic bombing doctrine refined — lower heavy bomber production costs and extended operational range."
 BLHM_ENG_carrier_air_idea:0 "Carrier Air Wing Programme"
 BLHM_ENG_carrier_air_idea_desc:0 "Carrier-based aircraft development programme reduces production costs and improves naval strike capability."
 BLHM_ENG_air_production_modernisation_idea:0 "Air Production Modernisation"
 BLHM_ENG_air_production_modernisation_idea_desc:0 "Streamlined production lines reduce the cost of small aircraft airframes."
 BLHM_ENG_pilot_training_idea:0 "Pilot Training Programme"
 BLHM_ENG_pilot_training_idea_desc:0 "Enhanced pilot training improves fighter and interception efficiency at the cost of increased small aircraft production costs."
 BLHM_ENG_next_gen_ground_attack_idea:0 "Next-Generation Ground Attack"
 BLHM_ENG_next_gen_ground_attack_idea_desc:0 "Advanced ground attack tactics and munitions improve close air support effectiveness."
 BLHM_ENG_raf_exercises_idea:0 "RAF Exercises"
 BLHM_ENG_raf_exercises_idea_desc:0 "Regular intensive exercises accelerate pilot training and improve ace pilot effectiveness."
 BLHM_ENG_defence_of_britain_idea:0 "Defence of Britain"
 BLHM_ENG_defence_of_britain_idea_desc:0 "Optimised defensive fighter tactics further improve interception efficiency and partially offset training costs."
 BLHM_ENG_mio_fallback_production:0 "Supermarine Production Optimisation"
 BLHM_ENG_mio_fallback_production_desc:0 "Supermarine's production lines have been optimised — small aircraft airframe costs reduced."
 BLHM_ENG_mio_fallback_defence:0 "Supermarine Defensive Refinements"
 BLHM_ENG_mio_fallback_defence_desc:0 "Supermarine's air defence improvements provide better protection for our aircraft."

 BLHM_ENG_light_air_bonus:0 "Light Aircraft Development — Light Aircraft Research"

 BLHM_ENG_task.5.t:0 "Aviation Priority Period Expired"
 BLHM_ENG_task.5.d:0 "The exclusive priority period for the aviation armed forces branch has ended. Other branches may now be pursued."
 BLHM_ENG_task.5.a:0 "Understood."
 BLHM_ENG_task.7.t:0 "New Industrial Schemes"
 BLHM_ENG_task.7.d:0 "Our engineers have developed new industrial schemes for Supermarine. Choose a focus for the programme."
 BLHM_ENG_task.7.a:0 "Production Optimisation — reduce small aircraft costs by 10%"
 BLHM_ENG_task.7.b:0 "Defensive Refinements — improve air defence by 10%"

 BLHM_ENG_land_forces:0 "Land Forces"
 BLHM_ENG_land_forces_desc:0 "Expanding our army's potential is a necessary measure for a world power. Establishes a training programme for all allies and supplies our factories."
 BLHM_ENG_tank_development:0 "Tank Development"
 BLHM_ENG_tank_development_desc:0 "Invest in the development of armoured fighting vehicles. Choose one dominion to lead research and receive the New Tanks programme."
 BLHM_ENG_infantry_forces:0 "Infantry Forces"
 BLHM_ENG_infantry_forces_desc:0 "Strengthen our infantry with new equipment and tactics, accelerating weapons research and expanding production capacity."
 BLHM_ENG_infantry_forces_bonus:0 "Infantry Forces — Weapons Research"

 BLHM_ENG_study_french_conflict_experience:0 "Study French Conflict Experience"
 BLHM_ENG_study_french_conflict_experience_desc:0 "France's hard-won lessons in armoured warfare are invaluable. Incorporate their battlefield experience to improve our tank mobility."
 BLHM_ENG_seventeen_pounder:0 "17-pounder Anti-Tank Gun"
 BLHM_ENG_seventeen_pounder_desc:0 "Develop the powerful 17-pounder anti-tank gun, significantly improving our tanks' hard-hitting capability against enemy armour."
 BLHM_ENG_sherman_firefly:0 "Sherman Firefly Programme"
 BLHM_ENG_sherman_firefly_desc:0 "Mount the 17-pounder on the American Sherman chassis to create a devastating tank destroyer variant with production efficiencies."
 BLHM_ENG_global_tank_doctrine_update:0 "Global Tank Doctrine Update"
 BLHM_ENG_global_tank_doctrine_update_desc:0 "Standardise tank production and tactical doctrine across the Empire, reducing costs and improving industrial efficiency."
 BLHM_ENG_updated_communications:0 "Updated Communications Systems"
 BLHM_ENG_updated_communications_desc:0 "Equip our armoured formations with advanced radio networks and coordination protocols for improved command and control."

 BLHM_ENG_canadian_landings:0 "Canadian Landings"
 BLHM_ENG_canadian_landings_desc:0 "Train and equip Canadian forces for amphibious assaults, improving naval invasion capabilities and marine combat effectiveness."
 BLHM_ENG_african_infantry_corps:0 "African Infantry Corps"
 BLHM_ENG_african_infantry_corps_desc:0 "Establish a dedicated African infantry corps with improved mobility, organisation, and defensive tactics."
 BLHM_ENG_indian_gurkhas:0 "Indian Gurkhas"
 BLHM_ENG_indian_gurkhas_desc:0 "Recruit and equip Gurkha regiments, renowned for their ferocity in close combat, with enhanced artillery support and reduced supply needs."
 BLHM_ENG_australian_rangers:0 "Australian Rangers"
 BLHM_ENG_australian_rangers_desc:0 "Develop elite ranger units from the Australian bush, trained for independent operations with superior combat skills."
 BLHM_ENG_new_zealand_special_forces:0 "New Zealand Special Forces"
 BLHM_ENG_new_zealand_special_forces_desc:0 "Form specialised New Zealand commando units for raiding and special operations behind enemy lines."

 BLHM_ENG_new_cadres_training:0 "New Cadres Training Programme"
 BLHM_ENG_new_cadres_training_desc:0 "A comprehensive training programme for new officer cadres, accelerating army doctrine development across the alliance."
 BLHM_ENG_allied_tanks:0 "Allied Tanks"
 BLHM_ENG_allied_tanks_desc:0 "Joint tank programme under British coordination. The inherent complexity of sharing multiple armour designs across the alliance reduces mobility, but improves armour and firepower."
 BLHM_ENG_allied_tanks_tt:0 "Allied Tanks effects: −15% armour speed, −15% organisation of light, medium, heavy, modern, super-heavy, and amphibious tank battalions only, +10% tank armour, −15% tank hard attack, +10% tank soft attack, and +15% tank production cost."
 BLHM_ENG_air_force_of_britain:0 "Air Force of Britain"
